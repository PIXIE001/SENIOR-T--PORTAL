<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#0f172a">
<title>SAG Teachers Daily Attendance Management System</title>

<style>
:root{
    --navy:#0f172a;
    --navy2:#172554;
    --blue:#2563eb;
    --sky:#0ea5e9;
    --gold:#d4a72c;
    --green:#16a34a;
    --red:#dc2626;
    --orange:#ea580c;
    --purple:#7c3aed;
    --bg:#f1f5f9;
    --card:#ffffff;
    --text:#0f172a;
    --muted:#64748b;
    --border:#e2e8f0;
    --shadow:0 10px 30px rgba(15,23,42,.07);
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Inter,Segoe UI,Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
}

button,input,select,textarea{
    font:inherit;
}

button{
    cursor:pointer;
}

.hidden{
    display:none!important;
}

/* LOGIN */

.login-page{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:30px;
    background:
        radial-gradient(circle at top right,rgba(37,99,235,.18),transparent 35%),
        radial-gradient(circle at bottom left,rgba(14,165,233,.12),transparent 35%),
        #f8fafc;
}

.login-box{
    width:min(1050px,100%);
    min-height:620px;
    background:white;
    border:1px solid var(--border);
    border-radius:24px;
    overflow:hidden;
    box-shadow:0 25px 70px rgba(15,23,42,.13);
    display:grid;
    grid-template-columns:1.05fr .95fr;
}

.login-brand{
    padding:55px;
    color:white;
    background:
        linear-gradient(145deg,rgba(15,23,42,.98),rgba(23,37,84,.96)),
        #0f172a;
    display:flex;
    flex-direction:column;
    justify-content:center;
}

.brand-mark{
    width:78px;
    height:78px;
    border-radius:20px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:25px;
    font-weight:900;
    color:white;
    background:linear-gradient(135deg,var(--blue),var(--sky));
    margin-bottom:28px;
    box-shadow:0 15px 35px rgba(37,99,235,.3);
}

.login-brand h1{
    font-size:32px;
    line-height:1.12;
    margin-bottom:18px;
}

.login-brand p{
    color:#cbd5e1;
    line-height:1.7;
    max-width:520px;
}

.brand-line{
    margin-top:35px;
    display:flex;
    gap:10px;
    flex-wrap:wrap;
}

.brand-pill{
    padding:9px 13px;
    border:1px solid rgba(255,255,255,.15);
    border-radius:999px;
    color:#e2e8f0;
    font-size:12px;
}

.login-form-area{
    padding:45px;
    display:flex;
    flex-direction:column;
    justify-content:center;
}

.login-tabs{
    display:flex;
    background:#f1f5f9;
    border-radius:12px;
    padding:4px;
    margin-bottom:24px;
}

.login-tab{
    flex:1;
    border:0;
    padding:12px;
    border-radius:9px;
    background:transparent;
    color:var(--muted);
    font-weight:700;
}

.login-tab.active{
    background:white;
    color:var(--blue);
    box-shadow:0 3px 10px rgba(15,23,42,.08);
}

.login-form h2{
    font-size:25px;
    margin-bottom:7px;
}

.login-subtitle{
    color:var(--muted);
    font-size:14px;
    margin-bottom:25px;
}

.field{
    margin-bottom:16px;
}

.field label{
    display:block;
    font-size:13px;
    font-weight:700;
    margin-bottom:7px;
}

.field input,
.field select,
.field textarea{
    width:100%;
    padding:12px 13px;
    border:1px solid var(--border);
    border-radius:10px;
    outline:none;
    background:white;
    color:var(--text);
    transition:.2s;
}

.field input:focus,
.field select:focus,
.field textarea:focus{
    border-color:var(--blue);
    box-shadow:0 0 0 3px rgba(37,99,235,.1);
}

.two-col{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
}

.primary-btn{
    width:100%;
    border:0;
    border-radius:11px;
    padding:13px 18px;
    background:linear-gradient(135deg,var(--blue),#1d4ed8);
    color:white;
    font-weight:800;
    box-shadow:0 8px 20px rgba(37,99,235,.2);
}

.secondary-btn{
    border:1px solid var(--border);
    border-radius:9px;
    background:white;
    color:var(--text);
    padding:9px 13px;
    font-weight:700;
}

.danger-btn{
    border:0;
    border-radius:9px;
    background:#fee2e2;
    color:#991b1b;
    padding:9px 13px;
    font-weight:700;
}

.success-btn{
    border:0;
    border-radius:9px;
    background:#dcfce7;
    color:#166534;
    padding:9px 13px;
    font-weight:700;
}

.login-demo{
    margin-top:18px;
    padding:12px;
    background:#f8fafc;
    border:1px solid var(--border);
    border-radius:10px;
    font-size:12px;
    color:var(--muted);
    line-height:1.7;
}

.testing-note{
    margin-top:12px;
    font-size:11px;
    color:#92400e;
    background:#fffbeb;
    border:1px solid #fde68a;
    padding:10px;
    border-radius:9px;
}

/* APP */

.app{
    min-height:100vh;
    display:flex;
}

.sidebar{
    width:255px;
    flex-shrink:0;
    min-height:100vh;
    background:var(--navy);
    color:white;
    display:flex;
    flex-direction:column;
    position:fixed;
    left:0;
    top:0;
    bottom:0;
    z-index:50;
}

.sidebar-brand{
    padding:25px 20px;
    border-bottom:1px solid rgba(255,255,255,.08);
}

.sidebar-brand-row{
    display:flex;
    align-items:center;
    gap:12px;
}

.sidebar-logo{
    width:43px;
    height:43px;
    border-radius:12px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:linear-gradient(135deg,var(--blue),var(--sky));
    font-weight:900;
}

.sidebar-brand strong{
    display:block;
    font-size:14px;
}

.sidebar-brand small{
    color:#94a3b8;
    display:block;
    margin-top:3px;
}

.nav{
    padding:17px 12px;
    overflow:auto;
    flex:1;
}

.nav-section{
    color:#64748b;
    text-transform:uppercase;
    font-size:10px;
    font-weight:900;
    letter-spacing:1px;
    padding:12px 10px 7px;
}

.nav-item{
    width:100%;
    border:0;
    color:#cbd5e1;
    background:transparent;
    text-align:left;
    border-radius:9px;
    padding:11px 12px;
    margin:2px 0;
    display:flex;
    align-items:center;
    gap:11px;
    font-size:13px;
    font-weight:650;
}

.nav-item:hover{
    background:rgba(255,255,255,.06);
    color:white;
}

.nav-item.active{
    color:white;
    background:linear-gradient(90deg,rgba(37,99,235,.75),rgba(37,99,235,.35));
}

.nav-icon{
    width:18px;
    text-align:center;
    font-weight:900;
}

.badge{
    margin-left:auto;
    min-width:20px;
    height:20px;
    border-radius:999px;
    background:#ef4444;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:10px;
    color:white;
}

.sidebar-footer{
    padding:15px;
    border-top:1px solid rgba(255,255,255,.08);
}

.user-mini{
    padding:12px;
    background:rgba(255,255,255,.05);
    border-radius:11px;
    margin-bottom:9px;
}

.user-mini strong{
    display:block;
    font-size:12px;
}

.user-mini small{
    color:#94a3b8;
}

.logout-btn{
    width:100%;
    border:1px solid rgba(255,255,255,.1);
    background:transparent;
    color:#cbd5e1;
    border-radius:9px;
    padding:9px;
}

.main{
    margin-left:255px;
    flex:1;
    min-width:0;
}

.topbar{
    height:70px;
    background:white;
    border-bottom:1px solid var(--border);
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 30px;
    position:sticky;
    top:0;
    z-index:30;
}

.topbar-title{
    font-size:16px;
    font-weight:850;
}

.topbar-sub{
    color:var(--muted);
    font-size:11px;
    margin-top:3px;
}

.topbar-right{
    display:flex;
    align-items:center;
    gap:15px;
}

.role-pill{
    padding:7px 11px;
    background:#eff6ff;
    color:#1d4ed8;
    border-radius:999px;
    font-size:11px;
    font-weight:800;
}

.content{
    padding:30px;
    max-width:1600px;
    margin:auto;
}

.page-header{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:20px;
    margin-bottom:25px;
}

.page-header h1{
    font-size:27px;
    letter-spacing:-.5px;
}

.page-header p{
    margin-top:5px;
    color:var(--muted);
    font-size:13px;
}

.header-actions{
    display:flex;
    gap:9px;
    flex-wrap:wrap;
}

/* DASHBOARD */

.hero{
    border-radius:18px;
    padding:27px;
    color:white;
    background:
        radial-gradient(circle at right top,rgba(14,165,233,.35),transparent 35%),
        linear-gradient(120deg,#0f172a,#172554);
    margin-bottom:23px;
    display:flex;
    justify-content:space-between;
    gap:20px;
    align-items:center;
}

.hero h2{
    font-size:24px;
    margin-bottom:7px;
}

.hero p{
    color:#cbd5e1;
    font-size:13px;
}

.hero-date{
    text-align:right;
    color:#cbd5e1;
    font-size:12px;
}

.kpi-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:15px;
    margin-bottom:22px;
}

.kpi{
    background:white;
    border:1px solid var(--border);
    border-radius:15px;
    padding:18px;
    box-shadow:var(--shadow);
    position:relative;
    overflow:hidden;
}

.kpi:after{
    content:"";
    position:absolute;
    right:-25px;
    top:-25px;
    width:80px;
    height:80px;
    border-radius:50%;
    background:#eff6ff;
}

.kpi-label{
    color:var(--muted);
    font-size:11px;
    font-weight:750;
}

.kpi-value{
    font-size:28px;
    font-weight:900;
    margin-top:7px;
}

.kpi-note{
    margin-top:5px;
    color:var(--muted);
    font-size:10px;
}

.dashboard-grid{
    display:grid;
    grid-template-columns:1.4fr 1fr;
    gap:20px;
}

.card{
    background:white;
    border:1px solid var(--border);
    border-radius:16px;
    box-shadow:var(--shadow);
    overflow:hidden;
}

.card-header{
    padding:17px 19px;
    border-bottom:1px solid var(--border);
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
}

.card-header h3{
    font-size:14px;
}

.card-body{
    padding:19px;
}

.quick-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:11px;
}

.quick{
    padding:15px;
    border:1px solid var(--border);
    border-radius:11px;
    background:#f8fafc;
    text-align:left;
}

.quick strong{
    display:block;
    font-size:12px;
}

.quick span{
    display:block;
    color:var(--muted);
    font-size:10px;
    margin-top:4px;
}

/* TABLE */

.table-wrap{
    overflow:auto;
}

table{
    width:100%;
    border-collapse:collapse;
    min-width:760px;
}

th{
    text-align:left;
    padding:11px 14px;
    background:#f8fafc;
    border-bottom:1px solid var(--border);
    color:#64748b;
    font-size:10px;
    text-transform:uppercase;
    letter-spacing:.4px;
    white-space:nowrap;
}

td{
    padding:12px 14px;
    border-bottom:1px solid #eef2f7;
    font-size:12px;
    white-space:nowrap;
}

tr:hover td{
    background:#fafcff;
}

.status{
    display:inline-flex;
    align-items:center;
    padding:5px 8px;
    border-radius:999px;
    font-size:9px;
    font-weight:850;
}

.status.green{
    background:#dcfce7;
    color:#166534;
}

.status.red{
    background:#fee2e2;
    color:#991b1b;
}

.status.orange{
    background:#ffedd5;
    color:#9a3412;
}

.status.blue{
    background:#dbeafe;
    color:#1e40af;
}

.status.gray{
    background:#f1f5f9;
    color:#475569;
}

.status.purple{
    background:#ede9fe;
    color:#6d28d9;
}

/* FILTERS */

.filters{
    display:flex;
    gap:9px;
    flex-wrap:wrap;
    padding:15px;
    background:#f8fafc;
    border-bottom:1px solid var(--border);
}

.filters input,
.filters select{
    padding:9px 11px;
    border:1px solid var(--border);
    border-radius:8px;
    background:white;
    font-size:11px;
    outline:none;
}

/* MODAL */

.modal-backdrop{
    position:fixed;
    inset:0;
    background:rgba(15,23,42,.55);
    z-index:100;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.modal{
    background:white;
    width:min(650px,100%);
    max-height:90vh;
    overflow:auto;
    border-radius:17px;
    box-shadow:0 30px 80px rgba(0,0,0,.25);
}

.modal-header{
    padding:18px 20px;
    border-bottom:1px solid var(--border);
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.modal-header h3{
    font-size:16px;
}

.close-btn{
    border:0;
    background:#f1f5f9;
    width:30px;
    height:30px;
    border-radius:8px;
}

.modal-body{
    padding:20px;
}

.modal-footer{
    padding:15px 20px;
    border-top:1px solid var(--border);
    display:flex;
    justify-content:flex-end;
    gap:8px;
}

/* LOCATION */

.location-layout{
    display:grid;
    grid-template-columns:1.25fr .75fr;
    gap:18px;
}

.location-map{
    height:470px;
    background:
        linear-gradient(30deg,rgba(148,163,184,.15) 12%,transparent 12.5%,transparent 87%,rgba(148,163,184,.15) 87.5%),
        linear-gradient(150deg,rgba(148,163,184,.1) 12%,transparent 12.5%,transparent 87%,rgba(148,163,184,.1) 87.5%),
        #f8fafc;
    background-size:90px 90px;
    position:relative;
    overflow:hidden;
}

.map-circle{
    position:absolute;
    width:360px;
    height:360px;
    border-radius:50%;
    border:2px dashed rgba(37,99,235,.5);
    background:rgba(37,99,235,.07);
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
}

.school-marker,
.teacher-marker{
    position:absolute;
    width:18px;
    height:18px;
    border-radius:50%;
    transform:translate(-50%,-50%);
    z-index:3;
}

.school-marker{
    left:50%;
    top:50%;
    background:#1d4ed8;
    border:4px solid white;
    box-shadow:0 0 0 5px rgba(37,99,235,.18);
}

.teacher-marker{
    background:#dc2626;
    border:3px solid white;
    box-shadow:0 0 0 4px rgba(220,38,38,.15);
}

.map-label{
    position:absolute;
    padding:7px 9px;
    border-radius:7px;
    background:white;
    border:1px solid var(--border);
    box-shadow:0 5px 15px rgba(15,23,42,.08);
    font-size:10px;
    z-index:5;
}

.school-label{
    left:50%;
    top:calc(50% + 20px);
    transform:translateX(-50%);
}

.location-info{
    display:grid;
    gap:10px;
}

.info-row{
    display:flex;
    justify-content:space-between;
    gap:15px;
    padding:11px;
    border-bottom:1px solid #eef2f7;
    font-size:12px;
}

.info-row span:first-child{
    color:var(--muted);
}

.info-row span:last-child{
    font-weight:800;
    text-align:right;
}

/* AI */

.ai-box{
    border:1px solid #ddd6fe;
    background:linear-gradient(135deg,#faf5ff,#f8fafc);
    border-radius:15px;
    padding:20px;
}

.ai-title{
    color:#6d28d9;
    font-weight:900;
    margin-bottom:7px;
}

.verdict{
    margin-top:15px;
    padding:14px;
    background:white;
    border-radius:11px;
    border:1px solid #e9d5ff;
}

.recommendation{
    margin-top:10px;
    padding:12px;
    border-left:3px solid var(--purple);
    background:white;
    font-size:12px;
    line-height:1.6;
}

/* PROFILE */

.profile-head{
    display:flex;
    gap:18px;
    align-items:center;
    margin-bottom:20px;
}

.avatar{
    width:70px;
    height:70px;
    border-radius:18px;
    background:linear-gradient(135deg,var(--blue),var(--sky));
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:23px;
    font-weight:900;
}

/* TOAST */

.toast-container{
    position:fixed;
    right:22px;
    bottom:22px;
    z-index:300;
    display:grid;
    gap:8px;
}

.toast{
    background:#0f172a;
    color:white;
    padding:13px 16px;
    border-radius:10px;
    box-shadow:0 12px 30px rgba(0,0,0,.2);
    font-size:12px;
    max-width:360px;
    animation:toastIn .25s ease;
}

.toast.success{
    border-left:4px solid #22c55e;
}

.toast.error{
    border-left:4px solid #ef4444;
}

@keyframes toastIn{
    from{transform:translateY(10px);opacity:0}
    to{transform:translateY(0);opacity:1}
}

/* RESPONSIVE */

@media(max-width:1050px){
    .kpi-grid{
        grid-template-columns:repeat(2,1fr);
    }
    .dashboard-grid,
    .location-layout{
        grid-template-columns:1fr;
    }
}

@media(max-width:800px){
    .login-box{
        grid-template-columns:1fr;
    }
    .login-brand{
        display:none;
    }
    .sidebar{
        width:72px;
    }
    .sidebar-brand strong,
    .sidebar-brand small,
    .nav-item span:not(.nav-icon),
    .nav-section,
    .user-mini{
        display:none;
    }
    .sidebar-brand{
        padding:15px;
    }
    .sidebar-brand-row{
        justify-content:center;
    }
    .nav-item{
        justify-content:center;
    }
    .main{
        margin-left:72px;
    }
    .content{
        padding:18px;
    }
    .topbar{
        padding:0 18px;
    }
    .topbar-sub{
        display:none;
    }
}

@media(max-width:600px){
    .two-col,
    .kpi-grid{
        grid-template-columns:1fr;
    }
    .page-header{
        flex-direction:column;
    }
    .hero{
        flex-direction:column;
        align-items:flex-start;
    }
    .hero-date{
        text-align:left;
    }
}

/* PRINT */

@media print{
    .sidebar,
    .topbar,
    .header-actions,
    .filters,
    button{
        display:none!important;
    }
    .main{
        margin:0;
    }
    .content{
        padding:0;
    }
    .card{
        box-shadow:none;
        border:1px solid #ddd;
    }
}
</style>
</head>

<body>

<div id="app"></div>
<div id="modalRoot"></div>
<div id="toastContainer" class="toast-container"></div>

<script>
"use strict";

/* =========================================================
   SCHOOL CONFIGURATION
========================================================= */

const DEFAULT_SCHOOL_LOCATION = {
    latitude: 1.735283,
    longitude: 40.039303,
    radius: 500
};

const SCHOOL_NAME =
    "SENIOR CHIEF ADANO DAY SECONDARY SCHOOL";

/* =========================================================
   DATABASE
========================================================= */

const DB = {
    users:"sag_users",
    attendance:"sag_attendance",
    settings:"sag_settings",
    audit:"sag_audit",
    applications:"sag_teacher_applications",
    session:"sag_session",
    corrections:"sag_corrections"
};

function readDB(key,fallback){
    try{
        const value = localStorage.getItem(key);
        return value === null ? fallback : JSON.parse(value);
    }catch(e){
        return fallback;
    }
}

function writeDB(key,value){
    localStorage.setItem(key,JSON.stringify(value));
}

function getSettings(){
    return readDB(DB.settings,{
        latitude:DEFAULT_SCHOOL_LOCATION.latitude,
        longitude:DEFAULT_SCHOOL_LOCATION.longitude,
        radius:DEFAULT_SCHOOL_LOCATION.radius,
        lateAfter:"08:00",
        expectedClockOut:"16:00"
    });
}

function saveSettings(settings){
    writeDB(DB.settings,settings);

/* =========================================================
   HELPERS
========================================================= */

function uid(prefix="ID"){
    return prefix+"-"+Date.now()+"-"+Math.random().toString(36).slice(2,8);
}

function escapeHTML(value){
    return String(value ?? "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
}

function formatDate(dateString){
    if(!dateString) return "-";
    return new Date(dateString).toLocaleDateString("en-KE",{
        day:"2-digit",
        month:"short",
        year:"numeric"
    });
}

function formatTime(dateString){
    if(!dateString) return "-";
    return new Date(dateString).toLocaleTimeString("en-KE",{
        hour:"2-digit",
        minute:"2-digit",
        second:"2-digit"
    });
}

function formatDateTime(dateString){
    if(!dateString) return "-";
    return formatDate(dateString)+" "+formatTime(dateString);
}

function todayISO(){
    const d = new Date();
    const y = d.getFullYear();
    const m = String(d.getMonth()+1).padStart(2,"0");
    const day = String(d.getDate()).padStart(2,"0");
    return `${y}-${m}-${day}`;
}

function getCurrentUser(){
    const session = readDB(DB.session,null);
    if(!session) return null;

    return readDB(DB.users,[]).find(
        u => u.id === session.userId
    ) || null;
}

function initials(name){
    return String(name||"")
        .split(" ")
        .filter(Boolean)
        .slice(0,2)
        .map(x=>x[0].toUpperCase())
        .join("");
}

function showToast(message,type="success"){
    const container=document.getElementById("toastContainer");

    const toast=document.createElement("div");
    toast.className="toast "+type;
    toast.textContent=message;

    container.appendChild(toast);

    setTimeout(()=>{
        toast.remove();
    },3500);
}

function addAudit(action,details,userId){
    const logs=readDB(DB.audit,[]);

    logs.unshift({
        id:uid("AUD"),
        action,
        details,
        userId:userId || getCurrentUser()?.id || null,
        timestamp:new Date().toISOString()
    });

    writeDB(DB.audit,logs);
}

function getActiveTeachers(){

/* =========================================================
   GPS
========================================================= */

function calculateDistance(lat1,lon1,lat2,lon2){

    const R=6371000;

    const toRadians=degrees =>
        degrees*Math.PI/180;

    const dLat=
        toRadians(lat2-lat1);

    const dLon=
        toRadians(lon2-lon1);

    const a=
        Math.sin(dLat/2)**2+
        Math.cos(toRadians(lat1))*
        Math.cos(toRadians(lat2))*
        Math.sin(dLon/2)**2;

    const c=
        2*Math.atan2(
            Math.sqrt(a),
            Math.sqrt(1-a)
        );

    return R*c;
}

function calculateDirection(
    schoolLat,
    schoolLon,
    teacherLat,
    teacherLon
){

    const lat1=
        schoolLat*Math.PI/180;

    const lat2=
        teacherLat*Math.PI/180;

    const dLon=
        (teacherLon-schoolLon)*Math.PI/180;

    const y=
        Math.sin(dLon)*Math.cos(lat2);

    const x=
        Math.cos(lat1)*Math.sin(lat2)-
        Math.sin(lat1)*Math.cos(lat2)*Math.cos(dLon);

    let bearing=
        Math.atan2(y,x)*180/Math.PI;

    bearing=(bearing+360)%360;

    const directions=[
        "NORTH",
        "NORTH-EAST",
        "EAST",
        "SOUTH-EAST",
        "SOUTH",
        "SOUTH-WEST",
        "WEST",
        "NORTH-WEST"
    ];

    return directions[
        Math.round(bearing/45)%8
    ];
}

function processTeacherLocation(position){

    const settings=getSettings();

    const teacherLat=
        position.coords.latitude;

    const teacherLon=
        position.coords.longitude;

    const accuracy=
        position.coords.accuracy;

    const distance=
        calculateDistance(
            settings.latitude,
            settings.longitude,
            teacherLat,
            teacherLon
        );

    const direction=
        calculateDirection(
            settings.latitude,
            settings.longitude,
            teacherLat,
            teacherLon
        );

    return {
        teacherLatitude:teacherLat,
        teacherLongitude:teacherLon,
        accuracy:accuracy,
        schoolLatitude:settings.latitude,
        schoolLongitude:settings.longitude,
        distance:Math.round(distance),
        direction,
        areaStatus:
            distance<=settings.radius
            ?"WITHIN"
            :"OUTSIDE"
    };
}

/* =========================================================
   AUTOMATIC 11-HOUR CLOCK OUT
========================================================= */

function processAutomaticClockouts(){

    const attendance=readDB(DB.attendance,[]);
    let changed=false;

    attendance.forEach(record=>{

        if(
            record.clockIn &&
            !record.clockOut
        ){

            const clockIn=
                new Date(record.clockIn);

            const automaticTime=
                new Date(
                    clockIn.getTime()+
                    11*60*60*1000
                );

            if(new Date()>=automaticTime){

                record.clockOut=
                    automaticTime.toISOString();

                record.clockOutType=
                    "AUTO_11_HOUR";

                record.status="COMPLETED";

                changed=true;
            }
        }
    });

    if(changed){
        writeDB(DB.attendance,attendance);
    }
}

function login(event){

    event.preventDefault();

    const username=
        document.getElementById("loginUsername")
        .value.trim();

    const password=
        document.getElementById("loginPassword")
        .value;

    const user=
        readDB(DB.users,[]).find(
            u =>
                u.username===username &&
                u.password===password
        );

    if(!user){
        showToast(
            "Invalid username or password.",
            "error"
        );
        return;
    }

    if(user.status!=="active"){
        showToast(
            "Your account is not active.",
            "error"
        );
        return;
    }

    writeDB(DB.session,{
        userId:user.id,
        loginAt:new Date().toISOString()
    });

    addAudit(
        "LOGIN",
        `${user.fullName} signed into the portal.`,
        user.id
    );

    startApp();
}

function submitTeacherApplication(event){

    event.preventDefault();

    const fullName=
        document.getElementById("regName").value.trim();

    const staffNo=
        document.getElementById("regStaffNo").value.trim();

    const username=
        document.getElementById("regUsername").value.trim();

    const password=
        document.getElementById("regPassword").value;

    const confirmPassword=
        document.getElementById("regConfirmPassword").value;

    const department=
        document.getElementById("regDepartment").value.trim();

    const subjects=
        document.getElementById("regSubjects").value.trim();

    const classTeacher=
        document.getElementById("regClassTeacher").value;

    if(password!==confirmPassword){
        showToast(
            "Passwords do not match.",
            "error"
        );
        return;
    }

    const users=readDB(DB.users,[]);
    const applications=readDB(DB.applications,[]);

    const duplicateUser=
        users.some(
            u =>
                u.username.toLowerCase()===username.toLowerCase() ||
                u.staffNo.toLowerCase()===staffNo.toLowerCase()
        );

    const duplicateApplication=
        applications.some(
            a =>
                (
                    a.username.toLowerCase()===username.toLowerCase() ||
                    a.staffNo.toLowerCase()===staffNo.toLowerCase()
                ) &&
                a.status==="PENDING"
        );

    if(duplicateUser || duplicateApplication){
        showToast(
            "Username or staff number already exists or is pending.",
            "error"
        );
        return;
    }

    const application={
        id:uid("APP"),
        fullName,
        staffNo,
        username,
        password,
        department,
        subjects,
        classTeacher,
        submittedAt:new Date().toISOString(),
        status:"PENDING"
    };

    applications.unshift(application);

    writeDB(DB.applications,applications);

    showToast(
        "Registration submitted. Awaiting administrator approval."
    );

    loginMode="signin";
    renderLogin();
}

function teacherClockIn(){

    if(!navigator.geolocation){

        showToast(
            "GPS is not supported by this browser.",
            "error"
        );

        return;
    }

    const user=getCurrentUser();

    const existing=
        readDB(DB.attendance,[])
        .find(
            a =>
                a.teacherId===user.id &&
                a.date===todayISO()
        );

    if(existing){
        showToast(
            "You have already clocked in today.",
            "error"
        );
        return;
    }

    showToast("Acquiring your GPS location...");

    navigator.geolocation.getCurrentPosition(

        position => {

            const location=
                processTeacherLocation(position);

            const record={
                id:uid("ATT"),
                teacherId:user.id,
                teacherName:user.fullName,
                staffNo:user.staffNo,
                date:todayISO(),
                clockIn:new Date().toISOString(),

                teacherLatitude:
                    location.teacherLatitude,

                teacherLongitude:
                    location.teacherLongitude,

                accuracy:
                    location.accuracy,

                schoolLatitude:
                    location.schoolLatitude,

                schoolLongitude:
                    location.schoolLongitude,

                distance:
                    location.distance,

                direction:
                    location.direction,

                areaStatus:
                    location.areaStatus,

                clockOut:null,
                clockOutType:null,
                status:"ACTIVE",
                corrected:false,
                createdAt:new Date().toISOString()
            };

            const attendance=
                readDB(DB.attendance,[]);

            attendance.unshift(record);

            writeDB(DB.attendance,attendance);

            addAudit(
                "TEACHER_CLOCK_IN",
                `${user.fullName} clocked in. Area status: ${location.areaStatus}.`,
                user.id
            );

            showToast(
                `Clock-in successful: ${location.areaStatus}`
            );

            navigate("clock");
        },

        error => {

            let message=
                "Unable to obtain your GPS location.";

            if(error.code===1){
                message=
                    "Location permission was denied. Please allow location access.";
            }

            if(error.code===2){
                message=
                    "Your location could not be determined.";
            }

            if(error.code===3){
                message=
                    "GPS request timed out. Please try again.";
            }

            showToast(message,"error");
        },

        {
            enableHighAccuracy:true,
            timeout:20000,
            maximumAge:0
        }
    );
}

function teacherClockOut(){

    const user=getCurrentUser();

    const attendance=
        readDB(DB.attendance,[]);

    const index=
        attendance.findIndex(
            a =>
                a.teacherId===user.id &&
                a.date===todayISO() &&
                !a.clockOut
        );

    if(index===-1){
        showToast(
            "No active attendance record found.",
            "error"
        );
        return;
    }

    attendance[index].clockOut=
        new Date().toISOString();

    attendance[index].clockOutType="MANUAL";

    attendance[index].status="COMPLETED";

    writeDB(DB.attendance,attendance);

    addAudit(
        "TEACHER_CLOCK_OUT",
        `${user.fullName} manually clocked out.`,
        user.id
    );

    showToast("Clock-out recorded.");

    navigate("clock");
}

function isLate(dateString){

    if(!dateString) return false;

    const settings=getSettings();

    const time=new Date(dateString);

    const clockMinutes=
        time.getHours()*60+
        time.getMinutes();

    const [h,m]=settings.lateAfter
        .split(":")
        .map(Number);

    return clockMinutes>=(h*60+m);
}

    const area=
        document.getElementById("attendanceArea")
        ?.value||"";

    document
        .querySelectorAll("#attendanceTable tbody tr")
        .forEach(row=>{

            const matchSearch=
                row.dataset.teacher?.includes(search) ||
                row.dataset.staff?.includes(search);

            const matchDate=
                !date ||
                row.dataset.date===date;

            const matchArea=
                !area ||
                row.dataset.area===area;

            row.style.display=
                matchSearch &&
                matchDate &&
                matchArea
                ?""
                :"none";
        });
}

function getMapPosition(record){

    const settings=getSettings();

    const latDelta=
        record.teacherLatitude-settings.latitude;

    const lonDelta=
        record.teacherLongitude-settings.longitude;

    const scale=0.003;

    let left=
        50+(lonDelta/scale)*50;

    let top=
        50-(latDelta/scale)*50;

    left=Math.max(8,Math.min(92,left));
    top=Math.max(8,Math.min(92,top));

    return {left,top};
}

function deactivateTeacher(id){

    const user=
        readDB(DB.users,[])
        .find(u=>u.id===id);

    if(!user) return;

    if(!confirm(
        `Deactivate ${user.fullName}?`
    )) return;

    const users=readDB(DB.users,[]);

    const index=
        users.findIndex(u=>u.id===id);

    users[index].status="inactive";

    writeDB(DB.users,users);

    addAudit(
        "TEACHER_DEACTIVATED",
        `${user.fullName} was deactivated.`,
        getCurrentUser().id
    );

    showToast("Teacher account deactivated.");

    navigate("teachers");
}

function approveApplication(id){

    const applications=
        readDB(DB.applications,[]);

    const index=
        applications.findIndex(a=>a.id===id);

    if(index===-1) return;

    const application=applications[index];

    if(application.status!=="PENDING"){
        return;
    }

    const users=readDB(DB.users,[]);

    const teacher={
        id:uid("USR"),
        fullName:application.fullName,
        staffNo:application.staffNo,
        username:application.username,
        password:application.password,
        department:application.department,
        subjects:application.subjects,
        classTeacher:application.classTeacher,
        role:"teacher",
        status:"active",
        createdAt:new Date().toISOString(),
        approvedAt:new Date().toISOString(),
        approvedBy:getCurrentUser().id
    };

    users.push(teacher);

    application.status="APPROVED";
    application.approvedAt=
        new Date().toISOString();
    application.approvedBy=
        getCurrentUser().id;

    writeDB(DB.users,users);
    writeDB(DB.applications,applications);

    addAudit(
        "TEACHER_APPROVED",
        `${application.fullName} was approved as a teacher.`,
        getCurrentUser().id
    );

    showToast(
        `${application.fullName} approved successfully.`
    );

    navigate("approvals");
}

function rejectApplication(id){

    const applications=
        readDB(DB.applications,[]);

    const application=
        applications.find(a=>a.id===id);

    if(!application) return;

    const reason=
        prompt(
            "Enter reason for rejection:"
        );

    if(reason===null) return;

    application.status="REJECTED";
    application.rejectedAt=
        new Date().toISOString();
    application.rejectedBy=
        getCurrentUser().id;
    application.rejectionReason=
        reason.trim()||"No reason supplied";

    writeDB(DB.applications,applications);

    addAudit(
        "TEACHER_REJECTED",
        `${application.fullName} application rejected. Reason: ${application.rejectionReason}`,
        getCurrentUser().id
    );

    showToast("Application rejected.");

    navigate("approvals");
}

function generateReport(){

    const start=
        document.getElementById("reportStart").value;

    const end=
        document.getElementById("reportEnd").value;

    const teacher=
        document.getElementById("reportTeacher").value;

    let records=
        readDB(DB.attendance,[]);

    records=
        records.filter(r=>
            r.date>=start &&
            r.date<=end &&
            (!teacher || r.teacherId===teacher)
        );

    const teachers=getActiveTeachers();

    const stats=teachers
        .filter(t=>!teacher || t.id===teacher)
        .map(t=>{

            const r=
                records.filter(
                    x=>x.teacherId===t.id
                );

            const present=r.length;

            const late=
                r.filter(x=>isLate(x.clockIn)).length;

function openCorrection(id){

    const record=
        readDB(DB.attendance,[])

    if(!record) return;

    openModal(
        "Correct Attendance",
        `

            <div class="info-row">
                <span>Teacher</span>
                <span>${escapeHTML(record.teacherName)}</span>
            </div>

                <span>${formatDateTime(record.clockIn)}</span>
            </div>

                    id="correctClockIn"
                    type="datetime-local"
                    value="${toDateTimeLocal(record.clockIn)}">
            </div>

            <div class="field">
                <label>Correction Reason</label>
                <textarea
                    id="correctionReason"
                    rows="4"
                    placeholder="Explain why this record is being corrected"></textarea>

        `

function toDateTimeLocal(iso){

    const d=new Date(iso);

    const pad=n=>String(n).padStart(2,"0");

    return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

function saveCorrection(id){

    const attendance=
        readDB(DB.attendance,[]);

    const index=
        attendance.findIndex(r=>r.id===id);

    if(index===-1) return;

    const record=attendance[index];

    const value=
        document.getElementById("correctClockIn").value;

    const reason=
        document.getElementById("correctionReason").value.trim();

    if(!value || !reason){
        showToast(
            "Enter the corrected time and reason.",
            "error"
        );
        return;
    }

    const corrected=
        new Date(value).toISOString();

    const correction={
        id:uid("COR"),
        attendanceId:id,
        teacherId:record.teacherId,
        teacherName:record.teacherName,
        originalClockIn:record.clockIn,
        correctedClockIn:corrected,
        reason,
        adminName:getCurrentUser().fullName,
        adminId:getCurrentUser().id,
        timestamp:new Date().toISOString()
    };

    const corrections=
        readDB(DB.corrections,[]);

    corrections.unshift(correction);

    record.clockIn=corrected;
    record.corrected=true;
    record.correctionId=correction.id;

    writeDB(DB.corrections,corrections);
    writeDB(DB.attendance,attendance);

    addAudit(
        "ATTENDANCE_CORRECTED",
        `${record.teacherName} attendance corrected. Reason: ${reason}`,
        getCurrentUser().id
    );

    closeModal();

    showToast("Attendance corrected with audit trail.");

    navigate("corrections");
}

function generateAIAnalysis(){

    const teachers=getActiveTeachers();

    const records=
        readDB(DB.attendance,[])
        .filter(r=>r.date===todayISO());

    const present=records.length;

    const absent=
        Math.max(teachers.length-present,0);

    const outside=
        records.filter(
            r=>r.areaStatus==="OUTSIDE"
        ).length;

    const late=
        records.filter(
            r=>isLate(r.clockIn)
        ).length;

    const pending=
        readDB(DB.applications,[])
        .filter(a=>a.status==="PENDING").length;

    let verdict="NORMAL OPERATIONS";
    let summary=
        "Current attendance records do not show a major system-level anomaly.";

    if(outside>0){

        verdict="REQUIRES REVIEW";

        summary=
            `${outside} attendance record(s) are outside the configured school monitoring radius. Review the Location Monitor before making any administrative decision.`;
    }

    else if(absent>0){

        verdict="ATTENTION REQUIRED";

        summary=
            `${absent} active teacher(s) have no attendance record for today. The administrator should verify the situation and follow the school's attendance procedure.`;
    }

    else if(late>0){

        verdict="MONITOR";

        summary=
            `${late} teacher(s) recorded clock-in after the configured late threshold. Review the detailed attendance records for context.`;
    }

    return {

        verdict,

        summary,

        facts:[
            {
                label:"Active teachers",
                value:String(teachers.length)
            },
            {
                label:"Attendance records today",
                value:String(present)
            },
            {
                label:"Not recorded",
                value:String(absent)
            },
            {
                label:"Late arrivals",
                value:String(late)
            },
            {
                label:"Outside-area records",
                value:String(outside)
            },
            {
                label:"Pending teacher applications",
                value:String(pending)
            }
        ],

        recommendations:[
            outside>0
            ?"Review outside-area GPS records and GPS accuracy."
            :"Continue monitoring GPS compliance.",

            absent>0
            ?"Verify teachers without records before concluding absence."
            :"No unrecorded active teachers detected.",

            late>0
            ?"Review late-arrival records against school policy."
            :"No late-arrival concern detected today.",

            pending>0
            ?"Review pending teacher applications in the Approval Centre."
            :"No pending teacher applications."
        ],

        priorities:[
            "Verify anomalies before taking action.",
            "Use the Attendance and Location Monitor together.",
            "Keep corrections fully documented.",
            "Use reports for periodic administrative review."
        ]
    };
}

function exportCSV(type){

    if(type!=="attendance") return;

    const records=
        readDB(DB.attendance,[]);

    const headers=[
        "Teacher",
        "Staff Number",
        "Date",
        "Clock In",
        "Clock Out",
        "Clock Out Type",
        "Teacher Latitude",
        "Teacher Longitude",
        "GPS Accuracy",
        "School Latitude",
        "School Longitude",
        "Distance",
        "Direction",
        "Area Status",
        "Corrected"
    ];

    const rows=
        records.map(r=>[
            r.teacherName,
            r.staffNo,
            r.date,
            r.clockIn,
            r.clockOut||"",
            r.clockOutType||"",
            r.teacherLatitude,
            r.teacherLongitude,
            r.accuracy,
            r.schoolLatitude,
            r.schoolLongitude,
            r.distance,
            r.direction,
            r.areaStatus,
            r.corrected?"YES":"NO"
        ]);

    const csv=[
        headers,
        ...rows
    ]
    .map(
        row =>
            row.map(
                value =>
                    `"${String(value??"")
                    .replaceAll('"','""')}"`
            ).join(",")
    )
    .join("\n");

    const blob=
        new Blob(
            [csv],
            {type:"text/csv;charset=utf-8;"}
        );

    const url=
        URL.createObjectURL(blob);

    const a=
        document.createElement("a");

    a.href=url;
    a.download=
        `SAG_Attendance_${todayISO()}.csv`;

    a.click();

    URL.revokeObjectURL(url);

    addAudit(
        "REPORT_EXPORTED",
        "Attendance CSV report exported.",
        getCurrentUser().id
    );
}

    startApp();
}else{
    renderLogin();
}

/* Keep automatic 11-hour processing alive */
setInterval(()=>{
    processAutomaticClockouts();

    if(getCurrentUser()){
        const activePage=
            document.getElementById("pageContent");

        if(activePage){
            renderPage();
        }
    }
},60000);

</script>
