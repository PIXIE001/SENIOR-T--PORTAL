<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SAG Attendance</title><style>body{margin:0;font:14px Arial;background:#f1f5f9;color:#0f172a}.auth{min-height:100vh;display:grid;place-items:center;background:#0f172a}.box{background:white;padding:28px;border-radius:16px;width:min(430px,90%)}input,select,button{width:100%;padding:11px;margin:6px 0;box-sizing:border-box;border-radius:8px;border:1px solid #cbd5e1}button{background:#2563eb;color:white;border:0;font-weight:bold;cursor:pointer}.app{display:flex;min-height:100vh}.side{width:230px;background:#0f172a;color:white;padding:18px}.side button{background:#1e293b;text-align:left}.main{flex:1;padding:25px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:white;border:1px solid #e2e8f0;border-radius:14px;padding:18px;margin:12px 0}.card b{font-size:28px;display:block}.table{overflow:auto;background:white;border-radius:12px}.table table{width:100%;border-collapse:collapse}.table th,.table td{padding:10px;border-bottom:1px solid #e2e8f0;text-align:left;white-space:nowrap}.ok{color:#15803d}.bad{color:#b91c1c}.hidden{display:none}@media(max-width:800px){.app{display:block}.side{width:auto}.cards{grid-template-columns:repeat(2,1fr)}} </style></head><body><div id="root"></div><script>
let token=localStorage.getItem('sag_token'),me=null,data=null;const $=x=>document.querySelector(x);async function api(p,o={}){o.headers={"Content-Type":"application/json",...(o.headers||{})};if(token)o.headers.Authorization='Bearer '+token;let r=await fetch('/api'+p,o),d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');return d}function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function msg(x){alert(x)}async function start(){try{if(token){me=(await api('/me')).user;return render()}}catch(e){localStorage.removeItem('sag_token');token=null}login()}function login(){root.innerHTML='<div class="auth"><div class="box"><h2>SAG Attendance</h2><p>Senior Chief Adano Day Secondary School</p><form id="f"><input name="username" placeholder="Username" required><input name="password" type="password" placeholder="Password" required><button>Sign In</button></form><button id="reg">New Teacher Registration</button><small>Demo: teacher/teacher123 · admin/admin123 · principal/principal123</small></div></div>';f.onsubmit=async e=>{e.preventDefault();try{let d=await api('/login',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(f)))});token=d.token;localStorage.setItem('sag_token',token);me=d.user;render()}catch(x){msg(x.message)}};reg.onclick=register}function register(){root.innerHTML='<div class="auth"><div class="box"><h2>Teacher Registration</h2><form id="r"><input name="fullName" placeholder="Full name" required><input name="staffNo" placeholder="Staff number" required><input name="username" placeholder="Username" required><input name="password" type="password" placeholder="Password" required><input name="department" placeholder="Department"><input name="subjects" placeholder="Subjects"><select name="classTeacher"><option value="NO">Not class teacher</option><option value="YES">Class teacher</option></select><button>Submit Application</button></form><button onclick="login()">Back</button></div></div>';r.onsubmit=async e=>{e.preventDefault();try{await api('/register',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(r)))});msg('Application submitted. Wait for admin approval.');login()}catch(x){msg(x.message)}}}async function render(){data=await api('/dashboard');let nav=me.role==='teacher'?['Dashboard','Clock In/Out','My Attendance']:me.role==='principal'?['Dashboard','Attendance Summary','Reports']:['Dashboard','Attendance','Teacher Approvals','Location Monitor','Reports','Audit Log','Settings'];root.innerHTML='<div class="app"><aside class="side"><h3>SAG ATTENDANCE</h3>'+nav.map(n=>`<button onclick="page('${n}')">${n}</button>`).join('')+'<button onclick="logout()">Logout</button></aside><main class="main"><h2>${me.fullName} <small>(${me.role})</small></h2><div id="page"></div></main></div>';page('Dashboard')}function logout(){localStorage.removeItem('sag_token');location.reload()}async function page(n){let p=$('#page');if(n==='Dashboard'){let s=data.stats;p.innerHTML=`<div class="cards">${[['Staff',s.totalStaff],['Present',s.present],['Absent',s.absent],['Late',s.late],['Outside',s.outside],['Clocked Out',s.clockedOut],['Open',s.open],['Auto Out',s.auto]].map(x=>`<div class="card"><small>${x[0]}</small><b>${x[1]}</b></div>`).join('')}</div>`}else if(n==='Clock In/Out'){let x=(data.mine||[]).find(a=>a.date===new Date().toISOString().slice(0,10));p.innerHTML=`<div class="card"><h3>Today's Attendance</h3>${x?`Clock in: ${x.clockIn}<br>Status: ${x.areaStatus}<br><button onclick="out()">Manual Clock Out</button>`:`<button onclick="clock()">Clock In Now</button>`}</div>`}else if(n==='My Attendance'||n==='Attendance'||n==='Attendance Summary'){let rows=data.attendance||[];p.innerHTML=table(rows)}else if(n==='Teacher Approvals'){let rows=data.applications||[];p.innerHTML='<h2>Teacher Approvals</h2><div class="table"><table><tr><th>Name</th><th>Staff</th><th>Username</th><th>Status</th><th>Action</th></tr>'+rows.map(x=>`<tr><td>${esc(x.fullName)}</td><td>${esc(x.staffNo)}</td><td>${esc(x.username)}</td><td>${x.status}</td><td>${x.status==='PENDING'?`<button onclick="approve('${x.id}')">Approve</button><button onclick="rejectA('${x.id}')">Reject</button>`:'—'}</td></tr>`).join('')+'</table></div>'}else if(n==='Location Monitor'){p.innerHTML='<div class="card"><h2>Location Monitor</h2><p>School: 1.735283, 40.039303 · Radius: 500 m</p></div>'+table(data.attendance||[])}else if(n==='Reports'){p.innerHTML='<div class="card"><button onclick="csv()">Export CSV</button><button onclick="print()">Print / Save PDF</button></div>'+table(data.attendance||[])}else if(n==='Audit Log'){p.innerHTML=table(data.audit||[])}else if(n==='Settings'){let s=data.settings;p.innerHTML=`<form id="set" class="card"><input name="latitude" value="${s.latitude}"><input name="longitude" value="${s.longitude}"><input name="radius" value="${s.radius}"><input name="lateAfter" type="time" value="${s.lateAfter}"><input name="expectedOut" type="time" value="${s.expectedOut}"><button>Save Settings</button></form>`;set.onsubmit=async e=>{e.preventDefault();let x=Object.fromEntries(new FormData(set));x.latitude=+x.latitude;x.longitude=+x.longitude;x.radius=+x.radius;try{await api('/settings',{method:'PUT',body:JSON.stringify(x)});msg('Saved');data=await api('/dashboard');page(n)}catch(z){msg(z.message)}}}}function table(rows){return '<div class="table"><table><tr><th>Teacher</th><th>Staff</th><th>Date</th><th>In</th><th>Out</th><th>Type</th><th>Distance</th><th>Direction</th><th>Area</th></tr>'+rows.map(x=>`<tr><td>${esc(x.fullName||x.adminName)}</td><td>${esc(x.staffNo||'')}</td><td>${esc(x.date||'')}</td><td>${esc(x.clockIn||'')}</td><td>${esc(x.clockOut||'')}</td><td>${esc(x.clockOutType||x.action||'')}</td><td>${esc(x.distance||'')}</td><td>${esc(x.direction||x.details||'')}</td><td>${esc(x.areaStatus||'')}</td></tr>`).join('')+'</table></div>'}async function clock(){navigator.geolocation.getCurrentPosition(async p=>{try{await api('/attendance/clock-in',{method:'POST',body:JSON.stringify({latitude:p.coords.latitude,longitude:p.coords.longitude,accuracy:p.coords.accuracy})});msg('Clock-in recorded');data=await api('/dashboard');page('Clock In/Out')}catch(e){msg(e.message)}},()=>msg('Allow location access'),{enableHighAccuracy:true,timeout:20000,maximumAge:0})}async function out(){try{await api('/attendance/clock-out',{method:'POST'});msg('Clock-out recorded');data=await api('/dashboard');page('Clock In/Out')}catch(e){msg(e.message)}}async function approve(id){try{await api('/applications/'+id+'/approve',{method:'POST'});data=await api('/dashboard');page('Teacher Approvals')}catch(e){msg(e.message)}}async function rejectA(id){let reason=prompt('Reason');if(!reason)return;try{await api('/applications/'+id+'/reject',{method:'POST',body:JSON.stringify({reason})});data=await api('/dashboard');page('Teacher Approvals')}catch(e){msg(e.message)}}function csv(){let a=data.attendance||[],h=['Teacher','Staff','Date','Clock In','Clock Out','Type','Distance','Direction','Area'];let s=[h,...a.map(x=>[x.fullName,x.staffNo,x.date,x.clockIn,x.clockOut,x.clockOutType,x.distance,x.direction,x.areaStatus])].map(r=>r.map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(',')).join('\n');let z=document.createElement('a');z.href=URL.createObjectURL(new Blob([s],{type:'text/csv'}));z.download='SAG_Attendance.csv';z.click()}start();
</script></body></html>
