<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#071d35">
<title>SAG | Teachers Attendance Management System</title>

<style>
/* =========================================================
   SAG MODERN DESKTOP ATTENDANCE PORTAL
   ========================================================= */

*{box-sizing:border-box;margin:0;padding:0}

:root{
 --navy:#071d35;
 --navy2:#0b2948;
 --blue:#1267a8;
 --sky:#42b4ed;
 --sky-soft:#eaf6fd;
 --gold:#d9aa36;
 --gold-soft:#fff7df;
 --green:#16834b;
 --green-soft:#e8f7ef;
 --red:#c93636;
 --red-soft:#fff0f0;
 --orange:#d77a18;
 --orange-soft:#fff3e3;
 --purple:#6857c8;
 --purple-soft:#f1efff;
 --text:#1c3449;
 --muted:#728493;
 --border:#dce7ef;
 --bg:#f3f7fa;
 --white:#fff;
 --shadow:0 8px 30px rgba(7,29,53,.07);
 --shadow-lg:0 20px 55px rgba(7,29,53,.13);
}

html{scroll-behavior:smooth}

body{
 font-family:Inter,Segoe UI,Arial,sans-serif;
 background:var(--bg);
 color:var(--text);
 min-height:100vh;
}

button,input,select,textarea{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}

/* ================= LOGIN ================= */

#loginScreen{
 min-height:100vh;
 display:flex;
 align-items:center;
 justify-content:center;
 padding:30px;
 background:
 radial-gradient(circle at 10% 10%,rgba(66,180,237,.20),transparent 30%),
 radial-gradient(circle at 90% 90%,rgba(217,170,54,.12),transparent 30%),
 linear-gradient(135deg,#06182c,#0b355c);
}

.login-card{
 width:470px;
 max-width:100%;
 background:#fff;
 border-radius:24px;
 padding:42px;
 box-shadow:0 30px 90px rgba(0,0,0,.30);
}

.login-brand{
 text-align:center;
 margin-bottom:28px;
}

.school-emblem{
 width:88px;
 height:88px;
 margin:auto;
 border-radius:24px;
 display:flex;
 align-items:center;
 justify-content:center;
 background:linear-gradient(135deg,var(--navy),var(--blue));
 color:#fff;
 font-size:25px;
 font-weight:900;
 box-shadow:0 10px 25px rgba(18,103,168,.25);
}

.login-brand h1{
 color:var(--navy);
 font-size:20px;
 line-height:1.35;
 margin-top:18px;
}

.login-brand p{
 color:var(--muted);
 font-size:13px;
 margin-top:7px;
}

.form-group{margin-bottom:16px}

.form-group label{
 display:block;
 font-size:12px;
 font-weight:800;
 color:#425b6e;
 margin-bottom:7px;
}

.form-control{
 width:100%;
 border:1px solid #cfdae2;
 background:#fff;
 border-radius:10px;
 padding:12px 13px;
 color:var(--text);
 outline:none;
 transition:.2s;
}

.form-control:focus{
 border-color:var(--sky);
 box-shadow:0 0 0 4px rgba(66,180,237,.12);
}

.btn{
 border:0;
 border-radius:10px;
 padding:11px 16px;
 font-size:12px;
 font-weight:800;
 transition:.2s;
 letter-spacing:.1px;
}

.btn:hover{
 transform:translateY(-1px);
 box-shadow:0 5px 15px rgba(7,29,53,.12);
}

.btn-primary{background:var(--navy);color:#fff}
.btn-blue{background:var(--blue);color:#fff}
.btn-success{background:var(--green);color:#fff}
.btn-danger{background:var(--red);color:#fff}
.btn-warning{background:var(--orange);color:#fff}
.btn-gold{background:var(--gold);color:#fff}
.btn-purple{background:var(--purple);color:#fff}
.btn-light{background:#edf4f8;color:var(--navy)}
.btn-white{background:#fff;color:var(--navy)}
.btn-small{padding:7px 10px;font-size:10px}
.full{width:100%}

.demo-box{
 margin-top:18px;
 background:#f4f8fb;
 border:1px solid var(--border);
 border-radius:11px;
 padding:13px;
 color:#667b8a;
 font-size:11px;
 line-height:1.8;
}

.alert{
 padding:13px 15px;
 border-radius:10px;
 border-left:4px solid;
 font-size:12px;
 line-height:1.55;
}

.alert-info{background:var(--sky-soft);border-color:var(--sky);color:#175a7f}
.alert-success{background:var(--green-soft);border-color:var(--green);color:#17663d}
.alert-warning{background:var(--orange-soft);border-color:var(--orange);color:#81500e}
.alert-danger{background:var(--red-soft);border-color:var(--red);color:#8a2828}

/* ================= APPLICATION ================= */

#app{display:none;min-height:100vh}

/* TOPBAR */

.topbar{
 position:fixed;
 left:0;
 right:0;
 top:0;
 height:76px;
 z-index:50;
 background:rgba(7,29,53,.97);
 backdrop-filter:blur(15px);
 color:#fff;
 display:flex;
 align-items:center;
 justify-content:space-between;
 padding:0 28px;
 box-shadow:0 4px 25px rgba(0,0,0,.14);
}

.brand{
 display:flex;
 align-items:center;
 gap:13px;
}

.brand-mark{
 width:45px;
 height:45px;
 border-radius:13px;
 background:#fff;
 color:var(--navy);
 display:flex;
 align-items:center;
 justify-content:center;
 font-weight:900;
 font-size:12px;
}

.brand-text strong{
 display:block;
 font-size:14px;
 letter-spacing:.3px;
}

.brand-text span{
 display:block;
 color:#a9c1d3;
 font-size:10px;
 margin-top:3px;
}

.user-area{
 display:flex;
 align-items:center;
 gap:13px;
}

.user-info{text-align:right}
.user-info strong{display:block;font-size:12px}
.user-info span{display:block;color:#a9c1d3;font-size:10px;margin-top:2px}

.role-badge{
 padding:7px 11px;
 border-radius:20px;
 background:rgba(255,255,255,.10);
 border:1px solid rgba(255,255,255,.12);
 font-size:10px;
 font-weight:800;
}

/* SIDEBAR */

.sidebar{
 position:fixed;
 top:76px;
 left:0;
 bottom:0;
 width:250px;
 background:#fff;
 border-right:1px solid var(--border);
 padding:18px 14px;
 overflow-y:auto;
 z-index:40;
}

.nav-section{
 color:#98a8b4;
 font-size:9px;
 font-weight:900;
 letter-spacing:1.2px;
 margin:17px 10px 8px;
 text-transform:uppercase;
}

.nav-btn{
 width:100%;
 border:0;
 background:transparent;
 color:#536b7c;
 padding:12px 13px;
 margin-bottom:3px;
 border-radius:9px;
 text-align:left;
 font-size:12px;
 font-weight:750;
 position:relative;
}

.nav-btn:hover{
 background:#f0f7fb;
 color:var(--navy);
}

.nav-btn.active{
 background:linear-gradient(90deg,#e7f4fc,#f4faff);
 color:var(--navy);
}

.nav-btn.active:before{
 content:"";
 position:absolute;
 left:0;
 top:7px;
 bottom:7px;
 width:3px;
 border-radius:4px;
 background:var(--sky);
}

/* MAIN */

.main{
 margin-left:250px;
 padding:106px 32px 30px;
 min-height:100vh;
 max-width:1900px;
}

.page-title{
 display:flex;
 justify-content:space-between;
 align-items:flex-start;
 gap:20px;
 margin-bottom:24px;
}

.page-title h2{
 color:var(--navy);
 font-size:27px;
 font-weight:850;
 letter-spacing:-.5px;
}

.page-title p{
 color:var(--muted);
 font-size:12px;
 margin-top:6px;
}

.page-actions{
 display:flex;
 gap:8px;
 flex-wrap:wrap;
}

/* DASHBOARD CARDS */

.cards{
 display:grid;
 grid-template-columns:repeat(4,minmax(0,1fr));
 gap:17px;
 margin-bottom:22px;
}

.card{
 background:#fff;
 border:1px solid var(--border);
 border-radius:15px;
 box-shadow:var(--shadow);
}

.stat-card{
 padding:21px;
 min-height:130px;
 position:relative;
 overflow:hidden;
}

.stat-card:after{
 content:"";
 position:absolute;
 width:100px;
 height:100px;
 border-radius:50%;
 right:-35px;
 bottom:-45px;
 background:#f0f7fb;
}

.stat-label{
 color:#78909f;
 font-size:10px;
 font-weight:850;
 letter-spacing:.5px;
}

.stat-value{
 color:var(--navy);
 font-size:31px;
 font-weight:900;
 margin-top:9px;
 position:relative;
 z-index:2;
}

.stat-note{
 color:#8a9aa5;
 font-size:10px;
 margin-top:5px;
 position:relative;
 z-index:2;
}

.stat-green .stat-value{color:var(--green)}
.stat-red .stat-value{color:var(--red)}
.stat-orange .stat-value{color:var(--orange)}
.stat-blue .stat-value{color:var(--blue)}
.stat-purple .stat-value{color:var(--purple)}

/* PANELS */

.grid-2{
 display:grid;
 grid-template-columns:repeat(2,minmax(0,1fr));
 gap:18px;
}

.grid-3{
 display:grid;
 grid-template-columns:repeat(3,minmax(0,1fr));
 gap:17px;
}

.section-card{
 background:#fff;
 border:1px solid var(--border);
 border-radius:15px;
 padding:21px;
 margin-bottom:18px;
 box-shadow:var(--shadow);
}

.section-card h3{
 color:var(--navy);
 font-size:15px;
 margin-bottom:15px;
 font-weight:850;
}

.section-card h4{
 color:var(--navy);
 font-size:13px;
 margin-bottom:10px;
}

.kpi-row{
 display:grid;
 grid-template-columns:repeat(4,1fr);
 gap:11px;
 margin-bottom:17px;
}

.kpi{
 background:#f5f9fb;
 border:1px solid #e7eef2;
 border-radius:11px;
 padding:14px 10px;
 text-align:center;
}

.kpi strong{
 display:block;
 color:var(--navy);
 font-size:22px;
}

.kpi span{
 color:#788b99;
 font-size:9px;
 font-weight:750;
}

/* FILTERS */

.filters{
 background:#fff;
 border:1px solid var(--border);
 border-radius:14px;
 padding:15px;
 margin-bottom:18px;
 display:flex;
 align-items:flex-end;
 gap:11px;
 flex-wrap:wrap;
 box-shadow:var(--shadow);
}

.filter-item{
 flex:1;
 min-width:150px;
}

.filter-item label{
 display:block;
 font-size:9px;
 font-weight:900;
 color:#748896;
 letter-spacing:.5px;
 margin-bottom:5px;
}

.filter-item .form-control{
 padding:9px 10px;
 font-size:11px;
}

/* TABLES */

.table-wrap{
 width:100%;
 overflow:auto;
 border:1px solid #e4ebf0;
 border-radius:11px;
}

table{
 width:100%;
 min-width:950px;
 border-collapse:collapse;
}

th{
 background:#f4f8fb;
 color:#536b7b;
 padding:12px 11px;
 font-size:9px;
 text-align:left;
 text-transform:uppercase;
 letter-spacing:.45px;
 border-bottom:1px solid var(--border);
 white-space:nowrap;
}

td{
 padding:12px 11px;
 font-size:11px;
 color:#40596a;
 border-bottom:1px solid #edf1f4;
 white-space:nowrap;
}

tbody tr:hover td{background:#fbfdfe}

.badge{
 display:inline-flex;
 align-items:center;
 padding:5px 8px;
 border-radius:20px;
 font-size:8px;
 font-weight:900;
 letter-spacing:.4px;
 white-space:nowrap;
}

.badge-green{background:var(--green-soft);color:#167344}
.badge-red{background:var(--red-soft);color:#a42828}
.badge-orange{background:var(--orange-soft);color:#a95e0e}
.badge-blue{background:var(--sky-soft);color:#17608a}
.badge-purple{background:var(--purple-soft);color:#5747b0}
.badge-gold{background:var(--gold-soft);color:#806116}
.badge-gray{background:#edf1f3;color:#637581}

/* PROGRESS */

.progress{
 width:100%;
 height:7px;
 border-radius:10px;
 background:#e9eef2;
 overflow:hidden;
}

.progress-bar{
 height:100%;
 border-radius:10px;
 background:linear-gradient(90deg,var(--blue),var(--sky));
}

/* LOCATION */

.location-box{
 height:390px;
 background:#edf5f8;
 border:1px solid var(--border);
 border-radius:14px;
 position:relative;
 overflow:hidden;
}

.map-grid{
 position:absolute;
 inset:0;
 background-image:
 linear-gradient(#d7e4e9 1px,transparent 1px),
 linear-gradient(90deg,#d7e4e9 1px,transparent 1px);
 background-size:42px 42px;
}

.school-radius{
 position:absolute;
 width:250px;
 height:250px;
 left:50%;
 top:50%;
 transform:translate(-50%,-50%);
 border:3px solid rgba(18,103,168,.42);
 border-radius:50%;
 background:rgba(66,180,237,.08);
}

.school-center{
 position:absolute;
 width:25px;
 height:25px;
 left:50%;
 top:50%;
 transform:translate(-50%,-50%);
 border:4px solid #fff;
 border-radius:50%;
 background:var(--navy);
 box-shadow:0 3px 12px #789;
}

.school-center:after{
 content:"SCHOOL";
 position:absolute;
 left:32px;
 top:1px;
 color:var(--navy);
 font-size:9px;
 font-weight:900;
}

.teacher-dot{
 position:absolute;
 width:18px;
 height:18px;
 border:3px solid white;
 border-radius:50%;
 background:var(--red);
 box-shadow:0 3px 10px #777;
 cursor:pointer;
}

.teacher-dot.within{background:var(--green)}

.map-legend{
 position:absolute;
 left:12px;
 bottom:12px;
 background:white;
 border-radius:9px;
 padding:9px 11px;
 box-shadow:0 4px 15px rgba(0,0,0,.1);
 font-size:9px;
 line-height:2;
}

.legend-dot{
 display:inline-block;
 width:9px;
 height:9px;
 border-radius:50%;
 margin-right:4px;
}

.legend-green{background:var(--green)}
.legend-red{background:var(--red)}

/* DETAIL */

.detail-grid{
 display:grid;
 grid-template-columns:repeat(2,minmax(0,1fr));
 gap:9px;
}

.detail-item{
 background:#f6f9fb;
 border:1px solid #edf1f3;
 padding:11px;
 border-radius:9px;
}

.detail-item label{
 display:block;
 color:#82939f;
 font-size:9px;
 margin-bottom:4px;
 font-weight:700;
}

.detail-item strong{
 display:block;
 color:var(--navy);
 font-size:11px;
 word-break:break-word;
}

/* CHART */

.chart-bars{
 display:flex;
 align-items:flex-end;
 gap:8px;
 height:190px;
 padding:12px 5px 0;
 border-bottom:1px solid var(--border);
}

.bar-col{
 flex:1;
 height:100%;
 display:flex;
 flex-direction:column;
 justify-content:flex-end;
 align-items:center;
}

.bar{
 width:35px;
 max-width:85%;
 background:linear-gradient(180deg,var(--sky),var(--blue));
 border-radius:6px 6px 0 0;
 min-height:2px;
}

.bar-value{
 font-size:8px;
 color:var(--navy);
 font-weight:900;
 margin-bottom:4px;
}

.bar-label{
 font-size:8px;
 color:#748793;
 margin-top:5px;
}

/* MODAL */

.modal{
 position:fixed;
 inset:0;
 z-index:100;
 display:none;
 align-items:center;
 justify-content:center;
 padding:25px;
 background:rgba(4,18,33,.62);
 backdrop-filter:blur(5px);
}

.modal.open{display:flex}

.modal-content{
 width:min(900px,100%);
 max-height:90vh;
 overflow:auto;
 background:white;
 border-radius:17px;
 box-shadow:var(--shadow-lg);
}

.modal-head{
 position:sticky;
 top:0;
 z-index:2;
 background:#fff;
 display:flex;
 justify-content:space-between;
 align-items:center;
 padding:17px 21px;
 border-bottom:1px solid var(--border);
}

.modal-head h3{
 color:var(--navy);
 font-size:16px;
}

.close{
 border:0;
 width:31px;
 height:31px;
 border-radius:50%;
 background:#edf2f5;
 color:#536a78;
 font-size:18px;
}

.modal-body{padding:21px}

/* AI */

.ai-hero{
 border-radius:16px;
 padding:24px;
 color:white;
 background:
 radial-gradient(circle at 90% 20%,rgba(255,255,255,.13),transparent 30%),
 linear-gradient(135deg,#101d4c,#5347a5);
 margin-bottom:18px;
}

.ai-hero small{
 color:#cbd0ff;
 font-size:9px;
 font-weight:900;
 letter-spacing:1px;
}

.ai-verdict{
 font-size:27px;
 font-weight:900;
 margin:8px 0;
}

.ai-hero p{
 font-size:11px;
 color:#dce0ff;
 line-height:1.6;
 max-width:700px;
}

.ai-list{
 margin-left:17px;
}

.ai-list li{
 font-size:11px;
 color:#5d7180;
 margin-bottom:8px;
 line-height:1.5;
}

/* REGISTRATION */

.registration-card{
 background:linear-gradient(135deg,#fff,#f4f9fc);
 border:1px solid var(--border);
 border-radius:14px;
 padding:18px;
}

.pending-count{
 display:inline-flex;
 width:24px;
 height:24px;
 border-radius:50%;
 align-items:center;
 justify-content:center;
 background:var(--red);
 color:#fff;
 font-size:9px;
 margin-left:5px;
}

/* FOOTER */

footer{
 text-align:center;
 padding:28px 0 5px;
 color:#91a0aa;
 font-size:9px;
}

/* MOBILE */

@media(max-width:1200px){
 .cards{grid-template-columns:repeat(2,1fr)}
 .grid-3{grid-template-columns:1fr 1fr}
}

@media(max-width:850px){
 .sidebar{width:70px;padding:12px 8px}
 .nav-section{font-size:0;text-align:center}
 .nav-btn{
  font-size:0;
  text-align:center;
  padding:13px 5px;
 }
 .nav-btn:before{
  content:"•";
  font-size:21px;
 }
 .nav-btn.active:before{content:"•"}
 .main{margin-left:70px;padding:96px 15px 25px}
 .topbar{padding:0 12px}
 .brand-text{display:none}
 .user-info{display:none}
 .grid-2,.grid-3{grid-template-columns:1fr}
 .page-title{flex-direction:column}
}

@media(max-width:550px){
 .cards{grid-template-columns:1fr}
 .kpi-row{grid-template-columns:1fr 1fr}
 .login-card{padding:28px 21px}
}
</style>
</head>

<body>

<!-- =========================================================
     LOGIN
========================================================= -->

<div id="loginScreen">

 <div class="login-card">

  <div class="login-brand">
   <div class="school-emblem">SAG</div>

   <h1>
    SENIOR CHIEF ADANO DAY SECONDARY SCHOOL
   </h1>

   <p>
    Teachers Daily Attendance Management System
   </p>
  </div>

  <form id="loginForm">

   <div class="form-group">
    <label>USERNAME</label>
    <input id="loginUsername"
           class="form-control"
           autocomplete="username"
           required>
   </div>

   <div class="form-group">
    <label>PASSWORD</label>
    <input id="loginPassword"
           type="password"
           class="form-control"
           autocomplete="current-password"
           required>
   </div>

   <button class="btn btn-primary full">
    SIGN IN
   </button>

  </form>

  <div id="loginMessage"></div>

  <div class="demo-box">
   <strong>DEMO ACCOUNTS</strong><br>
   Teacher: teacher / teacher123<br>
   Admin: admin / admin123<br>
   Principal: principal / principal123
  </div>

 </div>

</div>


<!-- =========================================================
     APPLICATION
========================================================= -->

<div id="app">

<header class="topbar">

 <div class="brand">

  <div class="brand-mark">SAG</div>

  <div class="brand-text">
   <strong>SENIOR CHIEF ADANO DAY SECONDARY SCHOOL</strong>
   <span>Teachers Daily Attendance Management System</span>
  </div>

 </div>

 <div class="user-area">

  <div class="user-info">
   <strong id="currentUserName"></strong>
   <span id="currentUserStaff"></span>
  </div>

  <div id="currentRole" class="role-badge"></div>

  <button class="btn btn-light btn-small"
          onclick="logout()">
   LOGOUT
  </button>

 </div>

</header>


<aside class="sidebar" id="sidebar"></aside>

<main class="main" id="mainContent"></main>

</div>


<!-- =========================================================
     MODAL
========================================================= -->

<div id="modal"
     class="modal"
     onclick="if(event.target===this)closeModal()">

 <div class="modal-content">

  <div class="modal-head">

   <h3 id="modalTitle">Details</h3>

   <button class="close"
           onclick="closeModal()">×</button>

  </div>

  <div class="modal-body"
       id="modalBody"></div>

 </div>

</div>


<script>

/* =========================================================
   SYSTEM CONFIGURATION
========================================================= */

const DEFAULT_SCHOOL_LOCATION={
 latitude:1.735369,
 longitude:40.038490,
 radius:500
};

const DEFAULT_SETTINGS={
 ...DEFAULT_SCHOOL_LOCATION,
 lateAfter:"08:00",
 expectedEnd:"16:00"
};


/* =========================================================
   DEMO USERS
========================================================= */

const DEFAULT_USERS=[

 {
  id:"T001",
  role:"teacher",
  username:"teacher",
  password:"teacher123",
  name:"Demo Teacher",
  staffNo:"SAG-T001",
  department:"Teaching",
  subjects:"Geography",
  classTeacher:"Yes",
  status:"ACTIVE"
 },

 {
  id:"A001",
  role:"admin",
  username:"admin",
  password:"admin123",
  name:"System Administrator",
  staffNo:"SAG-A001",
  department:"Administration",
  status:"ACTIVE"
 },

 {
  id:"P001",
  role:"principal",
  username:"principal",
  password:"principal123",
  name:"School Principal",
  staffNo:"SAG-P001",
  department:"Administration",
  status:"ACTIVE"
 }

];


/* =========================================================
   GLOBAL VARIABLES
========================================================= */

let currentUser=null;
let currentPage="dashboard";


/* =========================================================
   LOCAL DATABASE
========================================================= */

function getData(key,fallback){

 const raw=localStorage.getItem(key);

 if(raw===null){

  localStorage.setItem(
   key,
   JSON.stringify(fallback)
  );

  return JSON.parse(
   JSON.stringify(fallback)
  );
 }

 try{
  return JSON.parse(raw);
 }
 catch(e){
  return JSON.parse(
   JSON.stringify(fallback)
  );
 }
}

/* =========================================================
   DATE / TIME
========================================================= */

function localDate(date=new Date()){

 return new Intl.DateTimeFormat(
  "en-CA",
  {
   timeZone:"Africa/Nairobi",
   year:"numeric",
   month:"2-digit",
   day:"2-digit"
  }
 ).format(date);

}


function localTime(date=new Date()){

 return new Intl.DateTimeFormat(
  "en-GB",
  {
   timeZone:"Africa/Nairobi",
   hour:"2-digit",
   minute:"2-digit",
   second:"2-digit",
   hour12:false
  }
 ).format(date);

}


function formatDate(dateString){

 if(!dateString)return"-";

 const p=dateString.split("-");

 if(p.length!==3)return dateString;

 return `${p[2]}/${p[1]}/${p[0]}`;

}


function formatDateTime(iso){

 if(!iso)return"-";

 try{

  return new Intl.DateTimeFormat(
   "en-GB",
   {
    timeZone:"Africa/Nairobi",
    dateStyle:"medium",
    timeStyle:"short"
   }
  ).format(new Date(iso));

 }catch(e){

  return iso;

 }

}


function toISODate(date){
 return date.toISOString().slice(0,10);
}


function dateFromString(value){
 return new Date(
  value+"T00:00:00"
 );
}


function addDays(date,n){

 const d=new Date(date);

 d.setDate(
  d.getDate()+n
 );

 return d;

}


function startOfWeek(date){

 const d=new Date(date);

 const day=d.getDay();

 const diff=
  day===0?-6:1-day;

 d.setDate(
  d.getDate()+diff
 );

 d.setHours(0,0,0,0);

 return d;

}


function endOfWeek(date){

 return addDays(
  startOfWeek(date),
  6
 );

}


function startOfMonth(date){

 return new Date(
  date.getFullYear(),
  date.getMonth(),
  1
 );

}


function endOfMonth(date){

 return new Date(
  date.getFullYear(),
  date.getMonth()+1,
  0
 );

}


function workingDaysBetween(start,end){

 let count=0;

 const d=new Date(start);

 d.setHours(0,0,0,0);

 while(d<=end){

  const day=d.getDay();

  if(day!==0&&day!==6){
   count++;
  }

  d.setDate(
   d.getDate()+1
  );

 }

 return count;

}


function timeToMinutes(time){

 if(!time)return null;

 const p=time.split(":").map(Number);

 return p[0]*60+p[1];

}


function attendanceMinutes(a,b){

 if(!a||!b)return null;

 const start=timeToMinutes(a);
 const end=timeToMinutes(b);

 if(end>=start){
  return end-start;
 }

 return end+1440-start;

}


function durationText(minutes){

 if(minutes===null||minutes===undefined){
  return"-";
 }

 const h=Math.floor(
  minutes/60
 );

 const m=minutes%60;

 return `${h}h ${m}m`;

}


function isLate(clockIn){

 const settings=getSettings();

 return timeToMinutes(clockIn)>
        timeToMinutes(settings.lateAfter);

}


function isEarlyDeparture(clockOut,type){

 if(!clockOut)return false;

 if(type==="AUTO_11_HOUR")return false;

 return timeToMinutes(clockOut)<
        timeToMinutes(getSettings().expectedEnd);

}


/* =========================================================
   GPS ENGINE
========================================================= */

function calculateDistance(
 lat1,
 lon1,
 lat2,
 lon2
){

 const R=6371000;

 const rad=x=>x*Math.PI/180;

 const dLat=rad(lat2-lat1);

 const dLon=rad(lon2-lon1);

 const a=
  Math.sin(dLat/2)**2+
  Math.cos(rad(lat1))*
  Math.cos(rad(lat2))*
  Math.sin(dLon/2)**2;

 const c=
  2*Math.atan2(
   Math.sqrt(a),
   Math.sqrt(1-a)
  );

 return R*c;

}


function calculateDirection(
 schoolLat,
 schoolLon,
 teacherLat,
 teacherLon
){

 const lat1=
  schoolLat*Math.PI/180;

 const lat2=
  teacherLat*Math.PI/180;

 const dLon=
  (teacherLon-schoolLon)*
  Math.PI/180;

 const y=
  Math.sin(dLon)*
  Math.cos(lat2);

 const x=
  Math.cos(lat1)*
  Math.sin(lat2)-
  Math.sin(lat1)*
  Math.cos(lat2)*
  Math.cos(dLon);

 let bearing=
  Math.atan2(y,x)*
  180/Math.PI;

 bearing=(bearing+360)%360;

 const directions=[
  "NORTH",
  "NORTH-EAST",
  "EAST",
  "SOUTH-EAST",
  "SOUTH",
  "SOUTH-WEST",
  "WEST",
  "NORTH-WEST"
 ];

 return directions[
  Math.round(bearing/45)%8
 ];

}


function processTeacherLocation(position){

 const settings=getSettings();

 const teacherLat=
  position.coords.latitude;

 const teacherLon=
  position.coords.longitude;

 const accuracy=
  position.coords.accuracy;

 const distance=
  calculateDistance(
   settings.latitude,
   settings.longitude,
   teacherLat,
   teacherLon
  );

 const direction=
  calculateDirection(
   settings.latitude,
   settings.longitude,
   teacherLat,
   teacherLon
  );

 return{

  teacherLatitude:teacherLat,
  teacherLongitude:teacherLon,

  accuracy:accuracy,

  schoolLatitude:
   settings.latitude,

  schoolLongitude:
   settings.longitude,

  distance:
   Math.round(distance),

  direction,

  areaStatus:
   distance<=settings.radius?
   "WITHIN":
   "OUTSIDE"

 };

}


/* =========================================================
   AUTOMATIC 11-HOUR CLOCK OUT
========================================================= */

function processAutomaticClockouts(){

 const data=attendance();

 let changed=false;

 const current=new Date();

 data.forEach(record=>{

  if(
   record.clockInISO &&
   !record.clockOut
  ){

   const automaticTime=
    new Date(
     new Date(record.clockInISO)
      .getTime()+
     11*60*60*1000
    );

   record.autoClockOutDue=
    automaticTime.toISOString();

   if(current>=automaticTime){

    record.clockOut=
     localTime(automaticTime);

    record.clockOutISO=
     automaticTime.toISOString();

    record.clockOutType=
     "AUTO_11_HOUR";

    record.status=
     "CLOCKED OUT";

    changed=true;

    addSystemAudit(
     "AUTO_CLOCK_OUT",
     `Automatic 11-hour clock-out processed for ${record.teacherName}.`
    );

   }

  }

 });

 if(changed){
  saveAttendance(data);
 }

 return data;

}

function activeTeachers(){

 return users().filter(
  u=>
   u.role==="teacher" &&
   u.status!=="DISABLED"
 );

}


function recordsForDate(date){

 return attendance().filter(
  r=>r.date===date
 );

}


function recordForTeacherDate(
 teacherId,
 date
){

 return attendance().find(
  r=>
   r.teacherId===teacherId &&
   r.date===date
 );

}


function countPresent(date){

 return activeTeachers()
  .filter(
   t=>
    recordForTeacherDate(
     t.id,
     date
    )
  ).length;

}


function countNotRecorded(date){

 return Math.max(
  0,
  activeTeachers().length-
  countPresent(date)
 );

}


function countLate(date){

 return recordsForDate(date)
  .filter(
   r=>isLate(r.clockIn)
  ).length;

}


function countOutside(date){

 return recordsForDate(date)
  .filter(
   r=>r.areaStatus==="OUTSIDE"
  ).length;

}


function countStillClockedIn(date){

 return recordsForDate(date)
  .filter(
   r=>!r.clockOut
  ).length;

}


function countAuto(date){

 return recordsForDate(date)
  .filter(
   r=>r.clockOutType==="AUTO_11_HOUR"
  ).length;

}


function attendancePercentageForTeacher(
 teacherId,
 start,
 end
){

 const working=
  workingDaysBetween(
   start,
   end
  );

 if(!working)return 0;

 let present=0;

 const d=new Date(start);

 while(d<=end){

  if(
   d.getDay()!==0 &&
   d.getDay()!==6
  ){

   if(
    recordForTeacherDate(
     teacherId,
     toISODate(d)
    )
   ){
    present++;
   }

  }

  d.setDate(
   d.getDate()+1
  );

 }

 return Math.round(
  present/working*100
 );

}


function overallAttendancePercentage(
 start,
 end
){

 const teachers=
  activeTeachers();

 if(!teachers.length)return 0;

 const values=
  teachers.map(
   t=>
    attendancePercentageForTeacher(
     t.id,
     start,
     end
    )
  );

 return Math.round(
  values.reduce(
   (a,b)=>a+b,
   0
  )/values.length
 );

}

function teacherClockIn(){

 const today=localDate();

 if(
  recordForTeacherDate(
   currentUser.id,
   today
  )
 ){

  alert(
   "You have already clocked in today."
  );

  return;

 }

 if(!navigator.geolocation){

  alert(
   "Geolocation is not supported by this browser."
  );

  return;

 }

 alert(
  "Please allow location access so the attendance system can record your GPS position."
 );

 navigator.geolocation.getCurrentPosition(

  function(position){

   const location=
    processTeacherLocation(
     position
    );

   const clockInDate=
    new Date();

   const record={

    id:"ATT-"+Date.now(),

    teacherId:
     currentUser.id,

    teacherName:
     currentUser.name,

    staffNo:
     currentUser.staffNo,

    date:
     localDate(),

    clockIn:
     localTime(clockInDate),

    clockInISO:
     clockInDate.toISOString(),

    clockOut:null,

    clockOutISO:null,

    clockOutType:null,

    status:
     "CLOCKED IN",

    teacherLatitude:
     location.teacherLatitude,

    teacherLongitude:
     location.teacherLongitude,

    accuracy:
     location.accuracy,

    schoolLatitude:
     location.schoolLatitude,

    schoolLongitude:
     location.schoolLongitude,

    distance:
     location.distance,

    direction:
     location.direction,

    areaStatus:
     location.areaStatus,

    correction:null

   };

   const data=
    attendance();

   data.push(record);

   saveAttendance(data);

   addAudit(
    "CLOCK_IN",
    `${currentUser.name} clocked in. Area status: ${location.areaStatus}.`
   );

   alert(
    `Clock-in recorded successfully.\n\nArea status: ${location.areaStatus}`
   );

   showPage("clock");

  },

  function(error){

   let message=
    "Unable to obtain GPS location.";

   if(error.code===1){
    message=
     "Location permission was denied. Allow location access and try again.";
   }

   if(error.code===2){
    message=
     "Your location could not be determined.";
   }

   if(error.code===3){
    message=
     "The GPS request timed out. Please try again.";
   }

   alert(message);

  },

  {
   enableHighAccuracy:true,
   timeout:20000,
   maximumAge:0
  }

 );

}


function manualClockOut(){

 const date=localDate();

 const data=
  attendance();

 const record=
  data.find(
   r=>
    r.teacherId===currentUser.id &&
    r.date===date
  );

 if(!record){

  alert(
   "No clock-in record found."
  );

  return;

 }

 if(record.clockOut){

  alert(
   "You have already clocked out."
  );

  return;

 }

 const d=new Date();

 record.clockOut=
  localTime(d);

 record.clockOutISO=
  d.toISOString();

 record.clockOutType=
  "MANUAL";

 record.status=
  "CLOCKED OUT";

 saveAttendance(data);

 addAudit(
  "CLOCK_OUT",
  `${currentUser.name} manually clocked out.`
 );

 alert(
  "Manual clock-out recorded."
 );

 showPage("clock");

}

function getFilteredAttendance(){

 const date=
  document.getElementById(
   "attDate"
  )?.value||localDate();

 const teacher=
  document.getElementById(
   "attTeacher"
  )?.value||"";

 const status=
  document.getElementById(
   "attStatus"
  )?.value||"";

 const area=
  document.getElementById(
   "attArea"
  )?.value||"";

 const search=
  (
   document.getElementById(
    "attSearch"
   )?.value||""
  ).toLowerCase();

 let rows=
  attendance().filter(
   r=>r.date===date
  );

 if(teacher){
  rows=rows.filter(
   r=>r.teacherId===teacher
  );
 }

 if(area){
  rows=rows.filter(
   r=>r.areaStatus===area
  );
 }

 if(search){

  rows=rows.filter(
   r=>
    r.teacherName
     .toLowerCase()
     .includes(search)||
    r.staffNo
     .toLowerCase()
     .includes(search)
  );

 }

 if(status==="LATE"){
  rows=rows.filter(
   r=>isLate(r.clockIn)
  );
 }

 if(status==="STILL"){
  rows=rows.filter(
   r=>!r.clockOut
  );
 }

 if(status==="AUTO"){
  rows=rows.filter(
   r=>r.clockOutType==="AUTO_11_HOUR"
  );
 }

 if(status==="MANUAL"){
  rows=rows.filter(
   r=>r.clockOutType==="MANUAL"
  );
 }

 return rows;

}

function renderLocationMonitor(){

 const rows=
  recordsForDate(today);

 let dots="";

 rows.forEach(r=>{

  const settings=
   getSettings();

  const distance=
   r.distance||0;

  const ratio=
   Math.min(
    distance/
    (settings.radius*2),
    1
   );

  const angle={
   "NORTH":0,
   "NORTH-EAST":45,
   "EAST":90,
   "SOUTH-EAST":135,
   "SOUTH":180,
   "SOUTH-WEST":225,
   "WEST":270,
   "NORTH-WEST":315
  }[r.direction]||0;

  const radians=
   (angle-90)*
   Math.PI/180;

  const x=
   50+
   Math.cos(radians)*
   35*ratio;

  const y=
   50+
   Math.sin(radians)*
   35*ratio;

  dots+=`

  <div
   class="teacher-dot ${
    r.areaStatus==="WITHIN"?
    "within":
    ""
   }"
   title="${r.teacherName}"
   style="
    left:${x}%;
    top:${y}%;

   onclick="showAttendanceDetails('${r.id}')">

function approveRegistration(id){

 const data=
  registrations();

 const r=
  data.find(
   x=>x.id===id
  );

 if(!r)return;

 if(
  users().some(
   u=>
    u.username===r.username||
    u.staffNo===r.staffNo
  )
 ){

  alert(
   "A user with this username or staff number already exists."
  );

  return;

 }

 if(
  !confirm(
   `Approve ${r.name} as a teacher?`
  )
 )return;

 const user={
  id:"T"+Date.now(),

  role:"teacher",

  username:r.username,

  password:r.password,

  name:r.name,

  staffNo:r.staffNo,

  department:r.department||"Teaching",

  subjects:r.subjects||"",

  classTeacher:r.classTeacher||"No",

  status:"ACTIVE",

  approvedBy:currentUser.name,

  approvedAt:new Date().toISOString()

 };

 const userData=
  users();

 userData.push(user);

 saveData(
  "sag_users",
  userData
 );

 r.status="APPROVED";

 r.approvedBy=
  currentUser.name;

 r.approvedAt=
  new Date().toISOString();

 saveRegistrations(data);

 addAudit(
  "TEACHER_APPROVED",
  `Approved teacher registration for ${r.name}.`
 );

 alert(
  `${r.name} has been approved and can now log in.`
 );

 showPage("registrations");

}


function rejectRegistration(id){

 const data=
  registrations();

 const r=
  data.find(
   x=>x.id===id
  );

 if(!r)return;

 const reason=
  prompt(
   "Enter reason for rejection:"
  );

 if(!reason)return;

 r.status="REJECTED";

 r.rejectedBy=
  currentUser.name;

 r.rejectedAt=
  new Date().toISOString();

 r.rejectionReason=
  reason;

 saveRegistrations(data);

 addAudit(
  "TEACHER_REJECTED",
  `Rejected teacher registration for ${r.name}. Reason: ${reason}`
 );

 showPage("registrations");

}

function getReportRows(){

 const from=
  document.getElementById(
   "reportFrom"
  ).value;

 const to=
  document.getElementById(
   "reportTo"
  ).value;

 const teacher=
  document.getElementById(
   "reportTeacher"
  ).value;

 return attendance()
  .filter(
   r=>
    r.date>=from &&
    r.date<=to &&
    (
     !teacher||
     r.teacherId===teacher
    )
  )
  .sort(
   (a,b)=>
    b.date.localeCompare(a.date)
  );

}


function generateReport(){

 const from=
  document.getElementById(
   "reportFrom"
  ).value;

 const to=
  document.getElementById(
   "reportTo"
  ).value;

 const teacher=
  document.getElementById(
   "reportTeacher"
  ).value;

 const rows=
  getReportRows();

function csvEscape(value){

 const s=
  String(value??"");

 return`"${s.replace(
  /"/g,
  '""'
 )}"`;

}


function downloadText(
 text,
 filename
){

 const blob=
  new Blob(
   [text],
   {
    type:
     "text/csv;charset=utf-8"
   }
  );

 const url=
  URL.createObjectURL(blob);

 const a=
  document.createElement("a");

 a.href=url;

 a.download=filename;

 a.click();

 URL.revokeObjectURL(url);

}

function applyCorrection(id){

 const data=
  attendance();

 const r=
  data.find(
   x=>x.id===id
  );

 if(!r)return;

 const correctedIn=
  document.getElementById(
   "newClockIn"
  ).value;

 const correctedOut=
  document.getElementById(
   "newClockOut"
  ).value;

 const reason=
  document.getElementById(
   "corReason"
  ).value.trim();

 if(!correctedIn||!reason){

  alert(
   "Corrected clock-in and reason are required."
  );

  return;

 }

 const original={
  clockIn:r.clockIn,
  clockOut:r.clockOut,
  clockOutType:r.clockOutType
 };

 r.correction={

  originalClockIn:
   original.clockIn,

  originalClockOut:
   original.clockOut,

  originalClockOutType:
   original.clockOutType,

  correctedClockIn:
   correctedIn,

  correctedClockOut:
   correctedOut||null,

  admin:
   currentUser.name,

  timestamp:
   new Date().toISOString(),

  reason:
   reason

 };

 r.clockIn=
  correctedIn;

 r.clockOut=
  correctedOut||null;

 r.clockOutType=
  correctedOut?
  "MANUAL":
  null;

 r.status=
  correctedOut?
  "CLOCKED OUT":
  "CLOCKED IN";

 saveAttendance(data);

 const c=
  corrections();

 c.push({

  id:"COR-"+Date.now(),

  attendanceId:id,

  teacherId:r.teacherId,

  teacherName:r.teacherName,

  original,

  corrected:{
   clockIn:correctedIn,
   clockOut:correctedOut||null
  },

  admin:currentUser.name,

  reason,

  timestamp:
   new Date().toISOString()

 });

 saveCorrections(c);

 addAudit(
  "ATTENDANCE_CORRECTION",
  `Corrected attendance for ${r.teacherName}. Reason: ${reason}`
 );

 alert(
  "Correction saved successfully."
 );

 showPage("corrections");

}

function renderAI(){

 const today=
  localDate();

 const records=
  recordsForDate(today);

 const teachers=
  activeTeachers();

 const late=
  records.filter(
   r=>isLate(r.clockIn)
  );

 const outside=
  records.filter(
   r=>r.areaStatus==="OUTSIDE"
  );

 const missing=
  teachers.filter(
   t=>
    !recordForTeacherDate(
     t.id,
     today
    )
  );

 let verdict=
  "STABLE";

 if(
  outside.length>0||
  late.length>=3
 ){
  verdict=
   "REQUIRES REVIEW";
 }

 if(
  missing.length>=
  Math.ceil(
   teachers.length*.5
  ) &&
  teachers.length>0
 ){
  verdict=
   "HIGH ATTENDANCE RISK";
 }

 return pageHeader(
  "AI Intelligence",
  "Explainable attendance interpretation and management support"
 )+

 `

 <div class="ai-hero">

  <small>
   AI DAILY VERDICT
  </small>

  <div class="ai-verdict">
   ${verdict}
  </div>

  <p>
   The intelligence layer interprets verified attendance
   facts. It does not create, alter or invent attendance
   records.
  </p>

 </div>


 <div class="grid-2">

  <div class="section-card">

   <h3>Today's Analysis</h3>

   <ul class="ai-list">

    <li>
     ${records.length}
     attendance record(s) captured today.
    </li>

    <li>
     ${missing.length}
     active teacher(s) have no attendance record.
    </li>

    <li>
     ${late.length}
     late arrival(s) detected.
    </li>

    <li>
     ${outside.length}
     outside-area record(s) detected.
    </li>

   </ul>

  </div>


  <div class="section-card">

   <h3>Recommended Actions</h3>

   <ul class="ai-list">

    <li>
     Review missing attendance records.
    </li>

    <li>
     Investigate repeated late-arrival patterns.
    </li>

    <li>
     Verify outside-area records against GPS accuracy.
    </li>

    <li>
     Use formal reports before administrative decisions.
    </li>

   </ul>

  </div>

 </div>


 <div class="section-card">

  <h3>Teacher Performance Intelligence</h3>

  <div class="table-wrap">

   <table>

    <thead>
     <tr>
      <th>Teacher</th>
      <th>Attendance</th>
      <th>Late</th>
      <th>Outside</th>
      <th>Auto Out</th>
      <th>AI Signal</th>
     </tr>
    </thead>

    <tbody>

     ${teachers.map(
      t=>{

       const end=
        new Date();

       const start=
        addDays(end,-29);

       const rec=
        attendance().filter(
         r=>
          r.teacherId===t.id &&
          r.date>=toISODate(start)&&
          r.date<=toISODate(end)
        );

       const p=
        attendancePercentageForTeacher(
         t.id,
         start,
         end
        );

       const l=
        rec.filter(
         r=>isLate(r.clockIn)
        ).length;

       const o=
        rec.filter(
         r=>r.areaStatus==="OUTSIDE"
        ).length;

       const signal=
        p<75||l>=5||o>=3?
        "REQUIRES REVIEW":
        "NORMAL";

       return`

         <strong>${t.name}</strong>
        </td>

        <td>${p}%</td>

          signal==="NORMAL"?
          "badge-green":
          "badge-orange"
         }">
          ${signal}
         </span>

        </td>

       </tr>`;

      }
     ).join("")}

    </tbody>

}

function saveLocationSettings(){

 const s=
  getSettings();

 s.latitude=
  parseFloat(
   document.getElementById(
    "setLat"
   ).value
  );

 s.longitude=
  parseFloat(
   document.getElementById(
    "setLon"
   ).value
  );

 s.radius=
  parseInt(
   document.getElementById(
    "setRadius"
   ).value,
   10
  );

 if(
  Number.isNaN(s.latitude)||
  Number.isNaN(s.longitude)||
  Number.isNaN(s.radius)
 ){

  alert(
   "Please enter valid GPS settings."
  );

  return;

 }

 saveSettings(s);

 addAudit(
  "UPDATE_LOCATION_SETTINGS",
  `Updated school location to ${s.latitude}, ${s.longitude}, radius ${s.radius}m.`
 );

 alert(
  "School GPS settings saved."
 );

 showPage("settings");

}


function saveAttendanceSettings(){

 const s=
  getSettings();

 s.lateAfter=
  document.getElementById(
   "setLate"
  ).value;

 s.expectedEnd=
  document.getElementById(
   "setEnd"
  ).value;

 saveSettings(s);

 addAudit(
  "UPDATE_ATTENDANCE_POLICY",
  `Updated late time to ${s.lateAfter} and expected end to ${s.expectedEnd}.`
 );

 alert(
  "Attendance policy saved."
 );

 showPage("settings");

}

function openModal(
 title,
 body
){

 ).textContent=title;

 document.getElementById(
  "modalBody"
 ).innerHTML=body;

 document.getElementById(
  "modal"
 ).classList.add("open");

}


function closeModal(){

 document.getElementById(
  "modal"
 ).classList.remove("open");

}

function restoreSession(){

 const raw=
  sessionStorage.getItem(
   "sag_current_user"
  );

 if(!raw)return;

 try{

  currentUser=
   JSON.parse(raw);

  document.getElementById(
   "loginScreen"
  ).style.display="none";

  document.getElementById(
   "app"
  ).style.display="block";

  updateHeader();

  buildNavigation();

  showPage("dashboard");

 }catch(e){}

}


document.addEventListener(
 "DOMContentLoaded",
 function(){

  restoreSession();

  setInterval(
   function(){

    if(currentUser){

     processAutomaticClockouts();

    }

   },
   60000
  );

 }
);
