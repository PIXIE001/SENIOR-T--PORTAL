<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="theme-color" content="#0b2d4d">
<title>SAG Teachers Daily Attendance Management System</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
 --navy:#0b2d4d;
 --blue:#1769aa;
 --sky:#38a9e8;
 --light:#eef7fc;
 --gold:#d7a62a;
 --white:#fff;
 --green:#18864b;

 --orange:#d98216;

 --border:#d9e4ec;
 --shadow:0 8px 25px rgba(11,45,77,.10);
}
body{

 background:#f4f8fb;

}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}

#loginScreen{

 background:linear-gradient(135deg,#0b2d4d,#1769aa);
}
.login-card{

 padding:35px;
 box-shadow:0 25px 60px rgba(0,0,0,.25);
}
.school-logo{
 width:85px;height:85px;border-radius:50%;
 margin:0 auto 18px;
 display:flex;align-items:center;justify-content:center;
 background:#e8f5fc;
 border:4px solid var(--sky);
 color:var(--navy);
 font-size:25px;font-weight:bold;
}
.login-card h1{text-align:center;color:var(--navy);font-size:21px;line-height:1.3}
.login-card .subtitle{text-align:center;color:#687b89;margin:8px 0 25px}
.form-group{margin-bottom:15px}
.form-group label{display:block;font-weight:bold;font-size:13px;margin-bottom:6px}
.form-control{

 border:1px solid #cbd9e3;border-radius:9px;
 outline:none;background:#fff;
}
.form-control:focus{border-color:var(--sky);box-shadow:0 0 0 3px rgba(56,169,232,.12)}
.btn{
 border:0;border-radius:9px;padding:11px 16px;
 font-weight:bold;transition:.2s;
}
.btn:hover{transform:translateY(-1px)}
.btn-primary{background:var(--navy);color:#fff}
.btn-blue{background:var(--blue);color:#fff}
.btn-success{background:var(--green);color:#fff}
.btn-danger{background:var(--red);color:#fff}
.btn-warning{background:var(--orange);color:#fff}
.btn-light{background:#edf5fa;color:var(--navy)}
.btn-small{padding:7px 10px;font-size:12px}
.full{width:100%}
.demo-box{
 margin-top:18px;padding:12px;background:#f4f8fb;
 border-radius:10px;font-size:12px;color:#536a7b;
}
.demo-box strong{color:var(--navy)}

#app{display:none;min-height:100vh}
.topbar{
 height:70px;background:var(--navy);color:#fff;

 padding:0 22px;position:sticky;top:0;z-index:30;
 box-shadow:0 3px 15px rgba(0,0,0,.15);

.brand{display:flex;align-items:center;gap:12px}
.brand-mark{

 background:#fff;color:var(--navy);

 font-weight:bold;font-size:13px;
}
.brand-text strong{display:block;font-size:15px}
.brand-text span{font-size:11px;opacity:.75}
.user-area{display:flex;align-items:center;gap:12px}
.user-role{
 padding:5px 9px;border-radius:20px;background:rgba(255,255,255,.13);
 font-size:11px;
}
.sidebar{
 position:fixed;top:70px;bottom:0;left:0;width:235px;
 background:#fff;border-right:1px solid var(--border);
 padding:16px 12px;overflow-y:auto;
}
.nav-section{
 font-size:10px;text-transform:uppercase;color:#8a9aaa;
 font-weight:bold;padding:13px 10px 7px;
}
.nav-btn{
 width:100%;border:0;background:transparent;text-align:left;
 padding:11px 12px;border-radius:8px;color:#435b6d;
 margin-bottom:3px;font-weight:bold;font-size:13px;
}
.nav-btn:hover,.nav-btn.active{background:#e9f5fc;color:var(--navy)}
.main{
 margin-left:235px;padding:25px;max-width:1600px;
}
.page-title{
 display:flex;justify-content:space-between;align-items:center;
 gap:15px;margin-bottom:20px;
}
.page-title h2{font-size:24px;color:var(--navy)}
.page-title p{color:#718393;font-size:13px;margin-top:4px}
.page-actions{display:flex;gap:8px;flex-wrap:wrap}

.cards{
 display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin-bottom:20px;
}
.card{
 background:#fff;border:1px solid var(--border);
 border-radius:13px;padding:18px;box-shadow:var(--shadow);
}
.stat-card{position:relative;overflow:hidden}
.stat-card:after{
 content:"";position:absolute;right:-18px;bottom:-25px;
 width:80px;height:80px;border-radius:50%;background:#edf7fc;
}
.stat-label{font-size:12px;color:#758898;font-weight:bold}
.stat-value{font-size:29px;color:var(--navy);font-weight:bold;margin-top:7px}
.stat-note{font-size:11px;color:#8495a3;margin-top:5px}
.stat-blue .stat-value{color:var(--blue)}
.stat-green .stat-value{color:var(--green)}
.stat-red .stat-value{color:var(--red)}
.stat-orange .stat-value{color:var(--orange)}

.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}
.section-card{
 background:#fff;border:1px solid var(--border);
 border-radius:13px;padding:18px;margin-bottom:18px;
 box-shadow:var(--shadow);
}
.section-card h3{font-size:16px;color:var(--navy);margin-bottom:14px}
.filters{

}
.filter-item{min-width:140px;flex:1}

.table-wrap{overflow:auto}
table{width:100%;border-collapse:collapse;min-width:800px}
th{

 border-bottom:1px solid var(--border);

}
td{padding:11px;border-bottom:1px solid #edf1f4;font-size:12px;vertical-align:middle}
tr:hover td{background:#fafcfd}
.badge{

 font-size:10px;font-weight:bold;white-space:nowrap;

.badge-green{background:#e5f6ed;color:#167443}
.badge-red{background:#fdeaea;color:#a92525}
.badge-orange{background:#fff1dd;color:#ad6511}
.badge-blue{background:#e5f3fc;color:#17628f}
.badge-gray{background:#edf0f2;color:#62717d}
.badge-gold{background:#fff5d9;color:#866313}

.progress{
 height:8px;background:#e7edf1;border-radius:10px;overflow:hidden;
}
.progress-bar{height:100%;background:var(--blue);border-radius:10px}

.alert{

 font-size:12px;border-left:4px solid;
}
.alert-warning{background:#fff7e7;border-color:var(--orange);color:#81500e}
.alert-success{background:#eaf8f0;border-color:var(--green);color:#17663c}
.alert-danger{background:#fff0f0;border-color:var(--red);color:#8b2424}
.alert-info{background:#edf7fc;border-color:var(--sky);color:#195c81}

.muted{color:#788b99}
.small{font-size:11px}

}
.clock-display{

 position:relative;overflow:hidden;border:1px solid var(--border);
}
.map-grid{
 position:absolute;inset:0;
 background-image:
 linear-gradient(#dbe7ec 1px,transparent 1px),

 border:3px solid rgba(23,105,170,.5);

 transform:translate(-50%,-50%);
 background:rgba(56,169,232,.08);

.school-center{
 position:absolute;left:50%;top:50%;
 width:22px;height:22px;border-radius:50%;
 transform:translate(-50%,-50%);

}

 content:"SCHOOL";position:absolute;left:30px;top:1px;

}

.detail-grid{
 display:grid;grid-template-columns:repeat(2,1fr);gap:10px;

}

 border:0;background:#edf2f5;width:30px;height:30px;border-radius:50%;
 font-size:18px;color:#536a78;
}

.kpi-row{
 display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:15px;
}

}
.kpi strong{display:block;font-size:20px;color:var(--navy)}
.kpi span{font-size:10px;color:#728493}

.chart-bars{display:flex;gap:7px;align-items:flex-end;height:180px;padding-top:10px}
.bar-col{flex:1;text-align:center;height:100%;display:flex;flex-direction:column;justify-content:flex-end}
.bar{
 width:100%;max-width:38px;margin:0 auto;
 background:var(--sky);border-radius:5px 5px 0 0;min-height:2px;
}
.bar-label{font-size:9px;color:#70818d;margin-top:5px}

.ai-box{
 background:linear-gradient(135deg,#f2f7fc,#fff);
 border:1px solid #d5e6f0;border-radius:12px;padding:18px;

 font-size:20px;font-weight:bold;color:var(--navy);margin:8px 0;
}
.ai-list{margin:10px 0 0 18px}

 .grid-3{grid-template-columns:1fr 1fr}

 .nav-btn:before{content:"•";font-size:20px}

 .topbar{padding:0 12px}
 .cards,.grid-2,.grid-3{grid-template-columns:1fr}
 .kpi-row{grid-template-columns:1fr 1fr}
 .page-title{align-items:flex-start;flex-direction:column}
}
@media(max-width:500px){
 .cards{grid-template-columns:1fr}
 .login-card{padding:25px 20px}
 .filter-item{min-width:100%}
}
</style>
</head>

<body>

<script>
/* ============================================================
   SAG ATTENDANCE MANAGEMENT SYSTEM
   PHASE 1 - ADVANCED ATTENDANCE DASHBOARD
   ============================================================ */

const DEFAULT_SCHOOL_LOCATION = {
 latitude: 1.735369,
 longitude: 40.038490,
 radius: 500
};

const DEFAULT_SETTINGS = {
 ...DEFAULT_SCHOOL_LOCATION,
 lateAfter: "08:00",
 expectedEnd: "16:00"
};

const DEFAULT_USERS = [
 {
   id:"T001",
   role:"teacher",
   username:"teacher",
   password:"teacher123",
   name:"Demo Teacher",
   staffNo:"SAG-T001",
   department:"Teaching",
   subjects:"Geography",
   classTeacher:"Yes",
   status:"ACTIVE"
 },
 {
   id:"A001",
   role:"admin",
   username:"admin",
   password:"admin123",
   name:"System Administrator",
   staffNo:"SAG-A001",
   department:"Administration",
   status:"ACTIVE"
 },
 {
   id:"P001",
   role:"principal",
   username:"principal",
   password:"principal123",
   name:"School Principal",
   staffNo:"SAG-P001",
   department:"Administration",
   status:"ACTIVE"
 }
];

let currentUser = null;
let currentPage = "dashboard";

/* ---------------- STORAGE ---------------- */

function getData(key, fallback){
 const raw = localStorage.getItem(key);
 if(raw===null){
   localStorage.setItem(key,JSON.stringify(fallback));
   return JSON.parse(JSON.stringify(fallback));
 }
 try{return JSON.parse(raw)}
 catch(e){return JSON.parse(JSON.stringify(fallback))}
}

function saveData(key,value){
 localStorage.setItem(key,JSON.stringify(value));
}

function users(){
 return getData("sag_users",DEFAULT_USERS);
}

function attendance(){
 return getData("sag_attendance",[]);
}

function saveAttendance(data){
 saveData("sag_attendance",data);
}

function auditLogs(){
 return getData("sag_audit",[]);
}

function saveAudit(data){
 saveData("sag_audit",data);
}

function corrections(){
 return getData("sag_corrections",[]);
}

function saveCorrections(data){
 saveData("sag_corrections",data);
}

function getSettings(){
 return getData("sag_settings",DEFAULT_SETTINGS);
}

function saveSettings(data){
 saveData("sag_settings",data);
}

/* ---------------- DATE / TIME ---------------- */

function now(){
 return new Date();
}

function localDate(date=new Date()){
 return new Intl.DateTimeFormat("en-CA",{
   timeZone:"Africa/Nairobi",
   year:"numeric",
   month:"2-digit",
   day:"2-digit"
 }).format(date);
}

function localTime(date=new Date()){
 return new Intl.DateTimeFormat("en-GB",{
   timeZone:"Africa/Nairobi",
   hour:"2-digit",
   minute:"2-digit",
   second:"2-digit",
   hour12:false
 }).format(date);
}

function formatDate(dateString){
 if(!dateString)return "-";
 const parts=dateString.split("-");
 if(parts.length!==3)return dateString;
 return `${parts[2]}/${parts[1]}/${parts[0]}`;
}

function formatDateTime(iso){
 if(!iso)return "-";
 try{
   return new Intl.DateTimeFormat("en-GB",{
     timeZone:"Africa/Nairobi",
     dateStyle:"medium",
     timeStyle:"short"
   }).format(new Date(iso));
 }catch(e){return iso}
}

function dateFromString(s){
 return new Date(s+"T00:00:00");
}

function toISODate(date){
 return date.toISOString().slice(0,10);
}

function addDays(date,n){
 const d=new Date(date);
 d.setDate(d.getDate()+n);
 return d;
}

function startOfWeek(date){
 const d=new Date(date);
 const day=d.getDay();
 const diff=day===0?-6:1-day;
 d.setDate(d.getDate()+diff);
 d.setHours(0,0,0,0);
 return d;
}

function endOfWeek(date){
 return addDays(startOfWeek(date),6);
}

function startOfMonth(date){
 return new Date(date.getFullYear(),date.getMonth(),1);
}

function endOfMonth(date){
 return new Date(date.getFullYear(),date.getMonth()+1,0);
}

function workingDaysBetween(start,end){
 let count=0;
 let d=new Date(start);
 d.setHours(0,0,0,0);
 while(d<=end){
   const day=d.getDay();
   if(day!==0 && day!==6)count++;
   d.setDate(d.getDate()+1);
 }
 return count;
}

function timeToMinutes(time){
 if(!time)return null;
 const p=time.split(":").map(Number);
 return p[0]*60+p[1];
}

function attendanceMinutes(a,b){
 if(!a||!b)return null;
 const x=timeToMinutes(a);
 const y=timeToMinutes(b);
 if(y>=x)return y-x;
 return y+1440-x;
}

function durationText(minutes){
 if(minutes===null||minutes===undefined)return "-";
 const h=Math.floor(minutes/60);
 const m=minutes%60;
 return `${h}h ${m}m`;
}

function isLate(clockIn){
 const s=getSettings();
 const a=timeToMinutes(clockIn);
 const b=timeToMinutes(s.lateAfter);
 return a!==null && b!==null && a>b;
}

function isEarlyDeparture(clockOut,type){
 if(!clockOut || type==="AUTO_11_HOUR")return false;
 const s=getSettings();
 const a=timeToMinutes(clockOut);
 const b=timeToMinutes(s.expectedEnd);
 return a!==null && b!==null && a<b;
}

/* ---------------- GPS ---------------- */

function calculateDistance(lat1,lon1,lat2,lon2){
 const R=6371000;
 const toRadians=degrees=>degrees*Math.PI/180;
 const dLat=toRadians(lat2-lat1);
 const dLon=toRadians(lon2-lon1);

 const a=
   Math.sin(dLat/2)**2+
   Math.cos(toRadians(lat1))*
   Math.cos(toRadians(lat2))*
   Math.sin(dLon/2)**2;

 const c=2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
 return R*c;
}

function calculateDirection(schoolLat,schoolLon,teacherLat,teacherLon){
 const lat1=schoolLat*Math.PI/180;
 const lat2=teacherLat*Math.PI/180;
 const dLon=(teacherLon-schoolLon)*Math.PI/180;

 const y=Math.sin(dLon)*Math.cos(lat2);
 const x=
   Math.cos(lat1)*Math.sin(lat2)-
   Math.sin(lat1)*Math.cos(lat2)*Math.cos(dLon);

 let bearing=Math.atan2(y,x)*180/Math.PI;
 bearing=(bearing+360)%360;

 const directions=[
   "NORTH","NORTH-EAST","EAST","SOUTH-EAST",
   "SOUTH","SOUTH-WEST","WEST","NORTH-WEST"
 ];

 return directions[Math.round(bearing/45)%8];
}

function processTeacherLocation(position){
 const settings=getSettings();
 const teacherLat=position.coords.latitude;
 const teacherLon=position.coords.longitude;
 const accuracy=position.coords.accuracy;

 const distance=calculateDistance(
   settings.latitude,
   settings.longitude,
   teacherLat,
   teacherLon
 );

 const direction=calculateDirection(
   settings.latitude,
   settings.longitude,
   teacherLat,
   teacherLon
 );

 return {
   teacherLatitude:teacherLat,
   teacherLongitude:teacherLon,
   accuracy:accuracy,
   schoolLatitude:settings.latitude,
   schoolLongitude:settings.longitude,
   distance:Math.round(distance),
   direction:direction,
   areaStatus:distance<=settings.radius?"WITHIN":"OUTSIDE"
 };
}

/* ---------------- AUTOMATIC 11-HOUR CLOCKOUT ---------------- */

function processAutomaticClockouts(){
 const records=attendance();
 let changed=false;
 const current=new Date();

 records.forEach(r=>{
   if(r.clockInISO && !r.clockOut){
     const automaticTime=new Date(
       new Date(r.clockInISO).getTime()+11*60*60*1000
     );

     if(current>=automaticTime){
       r.clockOut=localTime(automaticTime);
       r.clockOutISO=automaticTime.toISOString();
       r.clockOutType="AUTO_11_HOUR";
       r.autoClockOutDue=automaticTime.toISOString();
       r.status="CLOCKED OUT";
       changed=true;
     }else{
       r.autoClockOutDue=automaticTime.toISOString();
     }
   }
 });

 if(changed)saveAttendance(records);
 return records;
}

function statCard(label,value,note="",className=""){
 return `
 <div class="card stat-card ${className}">
   <div class="stat-label">${label}</div>
   <div class="stat-value">${value}</div>
   <div class="stat-note">${note}</div>

function activeTeachers(){
 return users().filter(u=>u.role==="teacher"&&u.status!=="DISABLED");
}

function recordsForDate(date){
 return attendance().filter(r=>r.date===date);
}

function recordForTeacherDate(teacherId,date){
 return attendance().find(r=>r.teacherId===teacherId&&r.date===date);
}

function countPresent(date){
 return activeTeachers().filter(t=>recordForTeacherDate(t.id,date)).length;
}

function countNotRecorded(date){
 return Math.max(0,activeTeachers().length-countPresent(date));
}

function countLate(date){
 return recordsForDate(date).filter(r=>isLate(r.clockIn)).length;
}

function countOutside(date){
 return recordsForDate(date).filter(r=>r.areaStatus==="OUTSIDE").length;
}

function countStillClockedIn(date){
 return recordsForDate(date).filter(r=>!r.clockOut).length;
}

function countAuto(date){
 return recordsForDate(date).filter(r=>r.clockOutType==="AUTO_11_HOUR").length;
}

function attendancePercentageForTeacher(teacherId,start,end){
 const working=workingDaysBetween(start,end);
 if(working<=0)return 0;

 let present=0;
 let d=new Date(start);

 while(d<=end){
   const day=d.getDay();
   if(day!==0&&day!==6){
     if(recordForTeacherDate(teacherId,toISODate(d)))present++;
   }
   d.setDate(d.getDate()+1);
 }

 return Math.round((present/working)*100);
}

function overallAttendancePercentage(start,end){
 const teachers=activeTeachers();
 if(!teachers.length)return 0;

 const values=teachers.map(t=>attendancePercentageForTeacher(t.id,start,end));
 return Math.round(values.reduce((a,b)=>a+b,0)/values.length);
}

function teacherClockIn(){

 if(recordForTeacherDate(currentUser.id,localDate())){
   alert("You have already clocked in today.");
   return;
 }

 if(!navigator.geolocation){
   alert("Geolocation is not supported by this browser.");
   return;
 }

 alert("GPS location will now be requested. Please allow location access.");

 navigator.geolocation.getCurrentPosition(
   function(position){

     const location=processTeacherLocation(position);
     const date=localDate();
     const clockInDate=new Date();

     const record={
       id:"ATT-"+Date.now(),
       teacherId:currentUser.id,
       teacherName:currentUser.name,
       staffNo:currentUser.staffNo,
       date:date,
       clockIn:localTime(clockInDate),
       clockInISO:clockInDate.toISOString(),
       clockOut:null,
       clockOutISO:null,
       clockOutType:null,
       status:"CLOCKED IN",

       teacherLatitude:location.teacherLatitude,
       teacherLongitude:location.teacherLongitude,
       accuracy:location.accuracy,

       schoolLatitude:location.schoolLatitude,
       schoolLongitude:location.schoolLongitude,

       distance:location.distance,
       direction:location.direction,
       areaStatus:location.areaStatus,

       correction:null
     };

     const data=attendance();
     data.push(record);
     saveAttendance(data);

     addAudit(
       "CLOCK_IN",
       `Teacher ${currentUser.name} clocked in. Area status: ${location.areaStatus}.`
     );

     alert(
       `Clock-in recorded successfully.\n\nArea status: ${location.areaStatus}`
     );

     showPage("clock");
   },
   function(error){
     let message="Unable to obtain your GPS location.";

     if(error.code===1)message="Location permission was denied. Please allow location access and try again.";
     if(error.code===2)message="Your location could not be determined.";
     if(error.code===3)message="GPS request timed out. Please try again.";

     alert(message);
   },
   {
     enableHighAccuracy:true,
     timeout:20000,
     maximumAge:0
   }
 );
}

function manualClockOut(){

 const date=localDate();
 const data=attendance();
 const record=data.find(r=>r.teacherId===currentUser.id&&r.date===date);

 if(!record){
   alert("No clock-in record found for today.");
   return;
 }

 if(record.clockOut){
   alert("You have already clocked out.");
   return;
 }

 const d=new Date();

 record.clockOut=localTime(d);
 record.clockOutISO=d.toISOString();
 record.clockOutType="MANUAL";
 record.status="CLOCKED OUT";

 saveAttendance(data);

 addAudit(
   "CLOCK_OUT",
   `Teacher ${currentUser.name} manually clocked out.`
 );

 alert("Manual clock-out recorded.");
 showPage("clock");
}

function getFilteredAttendance(){

 let rows=attendance().filter(r=>r.date===date);

 if(teacher)rows=rows.filter(r=>r.teacherId===teacher);
 if(area)rows=rows.filter(r=>r.areaStatus===area);

 if(search){
   rows=rows.filter(r=>
     r.teacherName.toLowerCase().includes(search) ||
     r.staffNo.toLowerCase().includes(search)
   );
 }

 if(status==="PRESENT"){}
 if(status==="LATE")rows=rows.filter(r=>isLate(r.clockIn));
 if(status==="STILL")rows=rows.filter(r=>!r.clockOut);
 if(status==="AUTO")rows=rows.filter(r=>r.clockOutType==="AUTO_11_HOUR");
 if(status==="MANUAL")rows=rows.filter(r=>r.clockOutType==="MANUAL");

 return rows;
}

function renderLocationMonitor(){

 const today=localDate();
 const rows=attendance().filter(r=>r.date===today);

 let dots="";

 rows.forEach(r=>{
   const settings=getSettings();
   const distance=r.distance||0;

   const ratio=Math.min(distance/(settings.radius*2),1);
   const angle={
     "NORTH":0,
     "NORTH-EAST":45,
     "EAST":90,
     "SOUTH-EAST":135,
     "SOUTH":180,
     "SOUTH-WEST":225,
     "WEST":270,
     "NORTH-WEST":315
   }[r.direction]||0;

   const radians=(angle-90)*Math.PI/180;
   const center=50;
   const radius=35*ratio;

   const x=center+Math.cos(radians)*radius;
   const y=center+Math.sin(radians)*radius;

   dots+=`
   <div class="teacher-dot ${r.areaStatus==="WITHIN"?"within":""}"
        title="${r.teacherName}"
        style="left:${x}%;top:${y}%"
        onclick="showAttendanceDetails('${r.id}')"></div>`;
 });

 return pageHeader(
   "Location Monitor",
   "Administrative GPS monitoring for today's attendance"
 )+
 `
 <div class="grid-2">

   <div class="section-card">
     <h3>School Location</h3>
     <div class="location-box">
       <div class="map-grid"></div>
       <div class="school-radius"></div>
       <div class="school-center"></div>
       ${dots}
       <div class="map-legend">
         <div><span class="legend-dot legend-green"></span>Within school radius</div>
         <div><span class="legend-dot legend-red"></span>Outside radius</div>
       </div>
     </div>
     <div class="detail-grid" style="margin-top:12px">
       <div class="detail-item"><label>School Latitude</label><strong>${getSettings().latitude}</strong></div>
       <div class="detail-item"><label>School Longitude</label><strong>${getSettings().longitude}</strong></div>
       <div class="detail-item"><label>Radius</label><strong>${getSettings().radius} metres</strong></div>
       <div class="detail-item"><label>Today's Records</label><strong>${rows.length}</strong></div>
     </div>
   </div>

   <div class="section-card">
     <h3>Location Warnings</h3>
     ${
       rows.filter(r=>r.areaStatus==="OUTSIDE").length?
       `<div class="alert alert-warning">
         ${rows.filter(r=>r.areaStatus==="OUTSIDE").length}
         attendance record(s) were recorded outside the configured school radius.
       </div>`:
       `<div class="alert alert-success">No outside-area records detected today.</div>`
     }

     ${
       rows.filter(r=>(r.accuracy||999)>100).length?
       `<div class="alert alert-warning">
         ${rows.filter(r=>(r.accuracy||999)>100).length}
         record(s) have GPS accuracy lower than 100 metres.
       </div>`:""
     }
   </div>
 </div>

 <div class="section-card">
   <h3>Teacher Location Records — ${formatDate(today)}</h3>
   <div class="table-wrap">
   <table>
    <thead>
     <tr>
      <th>Teacher</th><th>Staff No.</th>
      <th>Latitude</th><th>Longitude</th>
      <th>Accuracy</th><th>Distance</th>
      <th>Direction</th><th>Status</th><th>Action</th>
     </tr>
    </thead>
    <tbody>
     ${
       rows.length?
       rows.map(r=>`
       <tr>
        <td class="bold">${r.teacherName}</td>
        <td>${r.staffNo}</td>
        <td>${Number(r.teacherLatitude).toFixed(6)}</td>
        <td>${Number(r.teacherLongitude).toFixed(6)}</td>
        <td>${Math.round(r.accuracy||0)}m</td>
        <td>${r.distance}m</td>
        <td>${r.direction}</td>
        <td><span class="badge ${r.areaStatus==="WITHIN"?"badge-green":"badge-red"}">${r.areaStatus}</span></td>
        <td><button class="btn btn-light btn-small" onclick="showAttendanceDetails('${r.id}')">VIEW</button></td>
       </tr>`).join(""):

function csvEscape(value){
 const s=String(value??"");
 return `"${s.replace(/"/g,'""')}"`;
}

function downloadText(text,fileName){

 const blob=new Blob([text],{type:"text/csv;charset=utf-8"});
 const url=URL.createObjectURL(blob);
 const a=document.createElement("a");
 a.href=url;
 a.download=fileName;
 a.click();
 URL.revokeObjectURL(url);
}

function findCorrectionRecord(){

 const date=document.getElementById("corDate").value;
 const teacher=document.getElementById("corTeacher").value;

 const r=recordForTeacherDate(teacher,date);

 if(!r){
   document.getElementById("correctionFinder").innerHTML=
    `<div class="alert alert-warning">No attendance record found.</div>`;
   return;
 }

 document.getElementById("correctionFinder").innerHTML=`
  <div class="alert alert-info">
   <strong>${r.teacherName}</strong><br>
   Original clock-in: ${r.clockIn}<br>
   Original clock-out: ${r.clockOut||"Still clocked in"}<br>
   Clock-out type: ${r.clockOutType||"PENDING"}
  </div>

  <div class="grid-2">
   <div class="form-group">
    <label>Corrected Clock In</label>
    <input id="newClockIn" type="time" class="form-control" value="${r.clockIn}">
   </div>
   <div class="form-group">
    <label>Corrected Clock Out</label>
    <input id="newClockOut" type="time" class="form-control" value="${r.clockOut||""}">
   </div>
  </div>

  <div class="form-group">
   <label>Reason for Correction</label>
   <textarea id="corReason" class="form-control" rows="3" placeholder="Explain why this record is being corrected"></textarea>
  </div>

  <button class="btn btn-primary" onclick="applyCorrection('${r.id}')">SAVE CORRECTION</button>`;
}

function applyCorrection(id){

 const data=attendance();
 const r=data.find(x=>x.id===id);

 if(!r)return;

 const correctedIn=document.getElementById("newClockIn").value;
 const correctedOut=document.getElementById("newClockOut").value;
 const reason=document.getElementById("corReason").value.trim();

 if(!correctedIn||!reason){
   alert("Corrected clock-in and reason are required.");
   return;
 }

 const original={
   clockIn:r.clockIn,
   clockOut:r.clockOut,
   clockOutType:r.clockOutType
 };

 r.correction={
   originalClockIn:original.clockIn,
   originalClockOut:original.clockOut,
   originalClockOutType:original.clockOutType,
   correctedClockIn:correctedIn,
   correctedClockOut:correctedOut||null,
   admin:currentUser.name,
   timestamp:new Date().toISOString(),
   reason:reason
 };

 r.clockIn=correctedIn;
 r.clockOut=correctedOut||null;
 r.clockOutType=correctedOut?"MANUAL":null;
 r.status=correctedOut?"CLOCKED OUT":"CLOCKED IN";

 saveAttendance(data);

 const c=corrections();
 c.push({
   id:"COR-"+Date.now(),
   attendanceId:id,
   teacherId:r.teacherId,
   teacherName:r.teacherName,
   original,
   corrected:{
     clockIn:correctedIn,
     clockOut:correctedOut||null
   },
   admin:currentUser.name,
   reason,
   timestamp:new Date().toISOString()
 });
 saveCorrections(c);

 addAudit(
   "ATTENDANCE_CORRECTION",
   `Corrected attendance for ${r.teacherName}. Reason: ${reason}`
 );

 alert("Correction saved with audit trail.");
 showPage("corrections");
}

   role:currentUser?.role||"SYSTEM",

 });

 saveAudit(logs);
}

/* ---------------- AI INTELLIGENCE ---------------- */

function renderAI(){

 const today=localDate();
 const records=recordsForDate(today);
 const teachers=activeTeachers();

 const late=records.filter(r=>isLate(r.clockIn));
 const outside=records.filter(r=>r.areaStatus==="OUTSIDE");
 const missing=teachers.filter(t=>!recordForTeacherDate(t.id,today));

 let verdict="STABLE";
 let verdictClass="success";

 if(outside.length>0||late.length>=3){
   verdict="REQUIRES REVIEW";
   verdictClass="warning";
 }

 if(missing.length>=Math.ceil(teachers.length*.5)&&teachers.length>0){
   verdict="HIGH ATTENDANCE RISK";
   verdictClass="danger";
 }

 return pageHeader(
   "AI Intelligence",
   "Explainable attendance analysis and management decision support"
 )+
 `
 <div class="ai-box">
   <div class="small bold">AI DAILY VERDICT</div>
   <div class="ai-verdict">${verdict}</div>

   <div class="alert alert-${verdictClass}">
    The AI layer interprets verified attendance facts. It does not create,
    modify or invent attendance records.
   </div>

   <ul class="ai-list">
    <li>${records.length} teacher attendance record(s) have been captured today.</li>
    <li>${missing.length} active teacher(s) have no attendance record today.</li>
    <li>${late.length} late arrival(s) have been detected.</li>
    <li>${outside.length} outside-area GPS record(s) require review.</li>
   </ul>
 </div>

 <div class="grid-2" style="margin-top:18px">
   <div class="section-card">
    <h3>Recommended Actions</h3>
    <ul class="ai-list">
     ${
       missing.length?
       `<li>Review the ${missing.length} staff member(s) without a recorded attendance entry.</li>`:
       `<li>No missing attendance records detected among active teachers today.</li>`
     }
     ${
       late.length?
       `<li>Review repeated late-arrival patterns rather than treating a single late record as a final disciplinary conclusion.</li>`:
       `<li>No late-arrival pattern detected today.</li>`
     }
     ${
       outside.length?
       `<li>Verify outside-area records against GPS accuracy and the circumstances of the attendance event.</li>`:
       `<li>No outside-area warning requires immediate review.</li>`
     }
     <li>Use the Reports section for evidence before making administrative decisions.</li>
    </ul>
   </div>

   <div class="section-card">
    <h3>AI Management Principles</h3>
    <ul class="ai-list">
      <li>Fact engine calculates attendance, time, GPS, distance and direction.</li>
      <li>AI interprets patterns and produces explainable summaries.</li>
      <li>AI does not alter attendance facts.</li>
      <li>AI recommendations remain subject to authorized human review.</li>
      <li>Irreversible disciplinary decisions should never be automated solely from AI output.</li>
    </ul>
   </div>
 </div>

 <div class="section-card">
  <h3>Teacher Performance Analysis</h3>
  <div class="table-wrap">
   <table>
    <thead>
     <tr><th>Teacher</th><th>30-Day Attendance</th><th>Late</th><th>Outside</th><th>Auto Out</th><th>AI Signal</th></tr>
    </thead>
    <tbody>
     ${teachers.map(t=>{
       const end=new Date();
       const start=addDays(end,-29);
       const rec=attendance().filter(r=>r.teacherId===t.id&&r.date>=toISODate(start)&&r.date<=toISODate(end));
       const p=attendancePercentageForTeacher(t.id,start,end);
       const l=rec.filter(r=>isLate(r.clockIn)).length;
       const o=rec.filter(r=>r.areaStatus==="OUTSIDE").length;
       const a=rec.filter(r=>r.clockOutType==="AUTO_11_HOUR").length;

       let signal="NORMAL";
       if(p<75||l>=5||o>=3)signal="REQUIRES REVIEW";

       return `
       <tr>
        <td class="bold">${t.name}</td>
        <td>${p}%</td>
        <td>${l}</td>
        <td>${o}</td>
        <td>${a}</td>
        <td>
         <span class="badge ${signal==="NORMAL"?"badge-green":"badge-orange"}">${signal}</span>
        </td>
       </tr>`;
     }).join("")}
    </tbody>
   </table>
  </div>
 </div>`;
}
